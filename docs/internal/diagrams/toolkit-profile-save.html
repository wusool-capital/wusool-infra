<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>How a profile command saves</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; background: #f7f5f0; color: #000523; min-height: 100vh;
      display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: 'Geist Mono', ui-monospace, Menlo, monospace; font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em;
      text-transform: uppercase; color: #56596b; margin-bottom: 0.5rem; }
    h1 { font-family: serif; font-size: 2rem; font-weight: 400; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 720px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · Wusool docs</p>
    <h1>How a profile command saves</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 720 568" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="toolkit-profile-save-title toolkit-profile-save-desc">
        <title id="toolkit-profile-save-title">How a profile command saves</title>
        <desc id="toolkit-profile-save-desc">Flowchart: check the role is new, write to Attio first, then write to the database in one transaction; a partial Attio write leaves the database alone and names what landed.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#56596b"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#336a85"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#336a85"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f7f5f0"/>
<line x1="260" y1="64" x2="260" y2="96" stroke="#56596b" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="260" y1="144" x2="260" y2="176" stroke="#56596b" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="260" y1="224" x2="260" y2="256" stroke="#56596b" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="364" y1="296" x2="440" y2="296" stroke="#56596b" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="260" y1="336" x2="260" y2="368" stroke="#336a85" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
<line x1="260" y1="416" x2="260" y2="448" stroke="#336a85" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
<rect x="390" y="276" width="24" height="12" rx="2" fill="#f7f5f0"/>
<text x="402" y="285" fill="#636575" font-size="8" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">NO</text>
<rect x="268" y="346" width="28" height="12" rx="2" fill="#f7f5f0"/>
<text x="282" y="355" fill="#336a85" font-size="8" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">YES</text>
<rect x="150" y="24" width="220" height="40" rx="20" fill="#f7f5f0"/>
<rect x="150" y="24" width="220" height="40" rx="20" fill="rgba(0,5,35,0.03)" stroke="rgba(0,5,35,0.30)" stroke-width="1"/>
<text x="260" y="48" fill="#000523" font-size="12" font-weight="600" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">Slack form submitted</text>
<rect x="140" y="96" width="240" height="48" rx="6" fill="#ffffff" stroke="#000523" stroke-width="1"/>
<text x="260" y="117" fill="#000523" font-size="12" font-weight="600" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">Check the role is new</text>
<text x="260" y="131" fill="#56596b" font-size="9" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle">adds · one role per vertical</text>
<rect x="140" y="176" width="240" height="48" rx="6" fill="#ffffff" stroke="#000523" stroke-width="1"/>
<text x="260" y="197" fill="#000523" font-size="12" font-weight="600" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">Write to Attio</text>
<text x="260" y="211" fill="#56596b" font-size="9" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle">organization if new · then role</text>
<polygon points="260,256 364,296 260,336 156,296" fill="#ffffff" stroke="#000523" stroke-width="1"/>
<text x="260" y="293" fill="#000523" font-size="12" font-weight="600" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">All Attio writes</text>
<text x="260" y="307" fill="#000523" font-size="12" font-weight="600" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">landed?</text>
<rect x="440" y="272" width="216" height="48" rx="6" fill="#ffffff" stroke="#000523" stroke-width="1"/>
<text x="548" y="293" fill="#000523" font-size="12" font-weight="600" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">Database left alone</text>
<text x="548" y="307" fill="#56596b" font-size="9" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle">Slack names what landed</text>
<rect x="140" y="368" width="240" height="48" rx="6" fill="#ffffff" stroke="#000523" stroke-width="1"/>
<text x="260" y="389" fill="#000523" font-size="12" font-weight="600" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">Write to the database</text>
<text x="260" y="403" fill="#56596b" font-size="9" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle">one transaction · org row lock</text>
<rect x="150" y="448" width="220" height="48" rx="20" fill="#f7f5f0"/>
<rect x="150" y="448" width="220" height="48" rx="20" fill="#c6e1ee" stroke="#336a85" stroke-width="1"/>
<text x="260" y="469" fill="#000523" font-size="12" font-weight="600" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">Saved</text>
<text x="260" y="483" fill="#56596b" font-size="9" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle">the bot confirms</text>
<line x1="24" y1="512" x2="696" y2="512" stroke="rgba(0,5,35,0.10)" stroke-width="0.8"/>
<text x="24" y="528" fill="#56596b" font-size="8" font-family="'Geist Mono', ui-monospace, Menlo, monospace" letter-spacing="0.18em">LEGEND</text>
<rect x="24" y="540" width="24" height="12" rx="6" fill="rgba(0,5,35,0.03)" stroke="rgba(0,5,35,0.30)" stroke-width="1"/>
<text x="56" y="549" fill="#56596b" font-size="9" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif">Start / end</text>
<rect x="144" y="540" width="24" height="12" rx="2" fill="#ffffff" stroke="#000523" stroke-width="1"/>
<text x="176" y="549" fill="#56596b" font-size="9" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif">Step</text>
<polygon points="228,546 240,540 252,546 240,552" fill="#ffffff" stroke="#000523" stroke-width="1"/>
<text x="260" y="549" fill="#56596b" font-size="9" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif">Decision</text>
<line x1="332" y1="546" x2="356" y2="546" stroke="#336a85" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
<text x="364" y="549" fill="#56596b" font-size="9" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif">Main path</text>
      </svg>
    </div>
  </div>
</body>
</html>
