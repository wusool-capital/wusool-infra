StylesPath = .github/styles
MinAlertLevel = warning

[CHANGELOG.md]
BasedOnStyles = Wusool, TechnicalDocs

[gitbook/README.md]
BasedOnStyles = Wusool, IndexDocs

[gitbook/SUMMARY.md]
BasedOnStyles = Wusool

[gitbook/user-guide/*.md]
BasedOnStyles = Wusool, UserDocs

[gitbook/technical-documentation/*.md]
BasedOnStyles = Wusool, TechnicalDocs

[gitbook/operations-and-handover/*.md]
BasedOnStyles = Wusool, OperationsDocs

[gitbook/release-notes/*.md]
BasedOnStyles = Wusool, UserDocs
