name: Engine quality

on:
  pull_request:
    branches: [dev, prod]

permissions:
  contents: read
  # `dorny/paths-filter` needs this on a private repo; see python-quality.yml.
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      engine: ${{ steps.filter.outputs.engine }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          # server/** too: an API change must regenerate engine-frontend/app/gen.
          filters: |
            engine:
              - 'engine-frontend/**'
              - 'server/app/modules/crm/**'
              - 'server/app/modules/engine/**'
              - 'server/scripts/export_openapi.py'
              - 'server/main.py'
              - '.github/workflows/engine-quality.yml'

  checks:
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [quality, api, build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: engine-frontend/package-lock.json
      - uses: astral-sh/setup-uv@v9.0.0
        if: matrix.target == 'api'
        with: { version: latest }
      - run: ./checks.sh ${{ matrix.target }}
        working-directory: engine-frontend

  engine-gate:
    name: Engine quality (required)
    if: always()
    needs: [changes, checks]
    runs-on: ubuntu-latest
    steps:
      - name: 'HARD GATE: blocks merge'
        run: |
          if [[ '${{ needs.changes.result }}' != 'success' || '${{ needs.checks.result }}' == 'failure' || '${{ needs.checks.result }}' == 'cancelled' ]]; then exit 1; fi
