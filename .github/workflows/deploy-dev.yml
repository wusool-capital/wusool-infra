# DEV deploys. Merging to `dev` applies every stack and rolls the toolkit app.
#
# Deliberately a separate file from deploy-prod.yml rather than one workflow
# branching on ${{ github.ref }}: the environment is then stated, not derived,
# and a mistake in branch-detection logic cannot send a dev deploy at prod.
name: Deploy dev

on:
  push:
    branches: [dev]
    paths:
      - 'terraform/**'
      - 'workflows/wusool-toolkit/**'
      - '.github/workflows/deploy-dev.yml'
      - '.github/workflows/_deploy.yml'
      - '.github/workflows/_build.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  # Builds and pushes an image to wusool-dev/toolkit. Not yet consumed by the
  # deploy below — the toolkit-ec2 module still builds on-box from git_ref
  # (see _deploy.yml's note). Kept running so real images land in ECR ahead of
  # the module being wired to pull them, rather than starting that pivot with
  # an empty registry.
  build:
    uses: ./.github/workflows/_build.yml
    with:
      environment: dev
      role_arn: arn:aws:iam::030179310793:role/wusool-gha-apply-dev

  deploy:
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: dev
      role_arn: arn:aws:iam::030179310793:role/wusool-gha-apply-dev
