# DEV deploys. Merging to `dev` builds the image and rolls it out.
#
# Deliberately a separate file from deploy-prod.yml rather than one workflow
# branching on ${{ github.ref }}: the environment is then stated, not derived,
# and a mistake in branch-detection logic cannot send a dev deploy at prod.
name: Deploy dev

on:
  push:
    branches: [dev]
    paths:
      - 'terraform/**'
      - 'workflows/wusool-toolkit/**'
      - '.github/workflows/deploy-dev.yml'
      - '.github/workflows/_deploy.yml'
      - '.github/workflows/_build.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  # Dev is the ONLY place images are built. Prod resolves the digest that dev
  # already validated - see deploy-prod.yml.
  build:
    uses: ./.github/workflows/_build.yml
    with:
      environment: dev
      role_arn: arn:aws:iam::030179310793:role/wusool-gha-apply-dev

  deploy:
    needs: build
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: dev
      role_arn: arn:aws:iam::030179310793:role/wusool-gha-apply-dev
      image_digest: ${{ needs.build.outputs.digest }}
