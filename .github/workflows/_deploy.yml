# Reusable deploy: apply every stack (base -> n8n -> toolkit -> postgres),
# then roll the toolkit app and ACTUALLY VERIFY it's running.
#
# Called by deploy-dev.yml and deploy-prod.yml. Never triggered directly, so
# the environment is always explicit at the call site rather than inferred
# from a branch name.
#
# Simplification, stated plainly: every stack is applied on every deploy,
# unconditionally. Each apply is a no-op if nothing in that stack changed, so
# this is safe, just not maximally efficient — path-filtered change detection
# (the plan's original design) is a follow-up, not yet built. Do not read the
# absence of change-detection as accidental; it is the documented fallback
# ("deploy everything") made permanent until it's worth the added complexity.
name: _deploy

on:
  workflow_call:
    inputs:
      environment:
        description: dev or prod
        required: true
        type: string
      role_arn:
        description: OIDC role to assume. Branch-scoped in its trust policy.
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    # Never cancel a running apply: a half-applied terraform run leaves state
    # and reality diverged and can orphan the state lock.
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false

    env:
      ENV: ${{ inputs.environment }}

    steps:
      - uses: actions/checkout@v4

      - name: Read OpenTofu version
        id: tofu
        run: echo "version=$(tr -d '[:space:]' < terraform/.opentofu-version)" >> "$GITHUB_OUTPUT"

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ steps.tofu.outputs.version }}
          tofu_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.role_arn }}
          aws-region: eu-central-1

      # stacks/account is intentionally NOT applied here — it is account-wide,
      # not per-environment, and is applied out of band (no -var-file, no
      # environment concurrency group of its own).

      - name: Apply stacks/base
        working-directory: terraform/stacks/base
        run: |
          set -euo pipefail
          tofu init -reconfigure -input=false \
            -backend-config=bucket=wusool-tfstate \
            -backend-config=region=me-central-1 \
            -backend-config=key=wusool/$ENV/base/terraform.tfstate \
            -backend-config=use_lockfile=true -backend-config=encrypt=true
          tofu apply -input=false -auto-approve -var-file=../../envs/$ENV.tfvars

      - name: Apply stacks/n8n
        working-directory: terraform/stacks/n8n
        run: |
          set -euo pipefail
          tofu init -reconfigure -input=false \
            -backend-config=bucket=wusool-tfstate \
            -backend-config=region=me-central-1 \
            -backend-config=key=wusool/$ENV/n8n/terraform.tfstate \
            -backend-config=use_lockfile=true -backend-config=encrypt=true
          tofu apply -input=false -auto-approve -var-file=../../envs/$ENV.tfvars

      - name: Apply stacks/toolkit
        working-directory: terraform/stacks/toolkit
        run: |
          set -euo pipefail
          tofu init -reconfigure -input=false \
            -backend-config=bucket=wusool-tfstate \
            -backend-config=region=me-central-1 \
            -backend-config=key=wusool/$ENV/toolkit/terraform.tfstate \
            -backend-config=use_lockfile=true -backend-config=encrypt=true
          tofu apply -input=false -auto-approve -var-file=../../envs/$ENV.tfvars

      - name: Apply stacks/postgres
        working-directory: terraform/stacks/postgres
        run: |
          set -euo pipefail
          tofu init -reconfigure -input=false \
            -backend-config=bucket=wusool-tfstate \
            -backend-config=region=me-central-1 \
            -backend-config=key=wusool/$ENV/postgres/terraform.tfstate \
            -backend-config=use_lockfile=true -backend-config=encrypt=true
          tofu apply -input=false -auto-approve -var-file=../../envs/$ENV.tfvars

      # -----------------------------------------------------------------
      # Everything below exists because `tofu apply` returning success proves
      # only that the SSM document was REGISTERED, not that the app deployed.
      # On 2026-08-16, three separate broken toolkit deploys reported
      # "Apply complete!" while the bootstrap actually failed. A deploy is not
      # done until the app is confirmed serving traffic.
      #
      # NOTE ON HOW THIS ROLLS THE APP TODAY: the toolkit-ec2 module still
      # does `git clone` + `docker compose build` on the instance itself (the
      # ECR-pull-by-digest pivot is scaffolded — repos + build workflow exist
      # — but not yet wired into the module). Re-running the bootstrap
      # document is therefore what picks up new app code, by pulling
      # whichever branch stacks/toolkit's git_ref points at. This is real,
      # working, current behavior — not a placeholder.
      # -----------------------------------------------------------------

      - name: Roll the toolkit app and wait for it
        id: bootstrap
        working-directory: terraform/stacks/toolkit
        run: |
          set -euo pipefail
          DOC=$(tofu output -raw bootstrap_document_name 2>/dev/null || echo "")
          IID=$(tofu output -raw instance_id 2>/dev/null || echo "")
          if [ -z "$DOC" ] || [ -z "$IID" ]; then
            echo "::notice::No toolkit instance in $ENV (create_instance=false) — skipping app rollout."
            echo "skipped=true" >> "$GITHUB_OUTPUT"; exit 0
          fi

          CMD=$(aws ssm send-command \
            --document-name "$DOC" --instance-ids "$IID" \
            --comment "deploy ${{ github.sha }}" \
            --query Command.CommandId --output text)
          echo "command: $CMD"

          # `ssm wait` gives up early on a long bootstrap, so poll explicitly.
          for _ in $(seq 1 60); do
            S=$(aws ssm get-command-invocation --command-id "$CMD" --instance-id "$IID" \
                  --query Status --output text 2>/dev/null || echo Pending)
            case "$S" in
              Success) echo "bootstrap succeeded"; exit 0 ;;
              Failed|Cancelled|TimedOut)
                echo "::error::Bootstrap $S"
                aws ssm get-command-invocation --command-id "$CMD" --instance-id "$IID" \
                  --query StandardErrorContent --output text | tail -40
                exit 1 ;;
            esac
            sleep 15
          done
          echo "::error::Bootstrap did not finish within 15 minutes"; exit 1

      - name: Verify the app actually serves
        if: steps.bootstrap.outputs.skipped != 'true'
        working-directory: terraform/stacks/toolkit
        run: |
          set -euo pipefail
          URL=$(tofu output -json app_urls 2>/dev/null | jq -r '.toolkit // empty')
          [ -n "$URL" ] || { echo "::notice::No app URL output — skipping health check."; exit 0; }

          # A successful bootstrap still leaves failure modes open: a container
          # can sit in `Created` when a port is already bound, which is exactly
          # what happened during the 2026-08-16 toolkit rename.
          for i in $(seq 1 20); do
            C=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 "$URL/health" || echo 000)
            echo "attempt $i: HTTP $C"
            [ "$C" = "200" ] && { echo "healthy"; exit 0; }
            sleep 15
          done
          echo "::error::$URL/health never returned 200 — deploy is NOT healthy"; exit 1

      # Written last, and only on success: recording it earlier would make a
      # failed deploy look deployed to the next run's change detection, once
      # change detection actually exists.
      - name: Record deployed SHA
        run: |
          aws ssm put-parameter --name "/wusool/$ENV/toolkit/deployed_sha" \
            --value "${{ github.sha }}" --type String --overwrite
