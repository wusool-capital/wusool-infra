# Reusable deploy: detect which stacks actually need it, apply only those
# (base -> n8n -> toolkit -> postgres, in dependency order), then roll and
# ACTUALLY VERIFY the n8n and toolkit apps that were applied.
#
# Called by deploy-dev.yml and deploy-prod.yml. Never triggered directly, so
# the environment is always explicit at the call site rather than inferred
# from a branch name.
#
# Per-stack change detection (2026-08-16): previously every stack was applied
# unconditionally on every deploy - safe (each apply is a no-op if nothing in
# that stack changed) but not free: a toolkit-only change still re-ran n8n's
# SSM bootstrap and its /healthz poll every single time, for no reason. Each
# stack now tracks its own `/wusool/<env>/<stack>/deployed_sha` in SSM and
# only redeploys when a path relevant to it changed since that SHA. Baseline
# missing (first deploy for that stack/env) or unreadable (rewritten history)
# always falls back to "deploy it" - never silently skip a stack we can't
# actually prove is unaffected.
name: _deploy

on:
  workflow_call:
    inputs:
      environment:
        description: dev or prod
        required: true
        type: string
      role_arn:
        description: OIDC role to assume. Branch-scoped in its trust policy.
        required: true
        type: string
      image_digest:
        description: 'Digest to deploy, e.g. "sha256:abc...". Required — comes from _build.yml.'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    # Never cancel a running apply: a half-applied terraform run leaves state
    # and reality diverged and can orphan the state lock.
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false

    env:
      ENV: ${{ inputs.environment }}

    steps:
      # fetch-depth: 0 - the detect step below diffs against an arbitrary
      # past commit (each stack's last deployed SHA), which a shallow clone
      # would not have.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-opentofu

      - uses: ./.github/actions/aws-oidc
        with:
          role_arn: ${{ inputs.role_arn }}

      - name: Detect which stacks changed
        id: detect
        run: |
          set -euo pipefail

          get_deployed_sha() {
            aws ssm get-parameter --name "/wusool/$ENV/$1/deployed_sha" \
              --query Parameter.Value --output text 2>/dev/null || echo ""
          }

          # __ALL__ is the "we can't prove this stack is unaffected" sentinel:
          # no recorded baseline (first deploy for this stack/env) or the
          # baseline commit isn't in our history (force-push/rebase) both
          # collapse to it, and `matches` below always deploys on __ALL__.
          changed_since() {
            local sha="$1"
            if [ -z "$sha" ]; then echo "__ALL__"; return; fi
            git diff --name-only "$sha" HEAD 2>/dev/null || echo "__ALL__"
          }

          matches() {
            local changed="$1" pattern="$2"
            [ "$changed" = "__ALL__" ] && return 0
            echo "$changed" | grep -qE "$pattern"
          }

          CHANGED_BASE=$(changed_since "$(get_deployed_sha base)")
          CHANGED_N8N=$(changed_since "$(get_deployed_sha n8n)")
          CHANGED_TOOLKIT=$(changed_since "$(get_deployed_sha toolkit)")
          CHANGED_POSTGRES=$(changed_since "$(get_deployed_sha postgres)")

          # Workflow/composite-action changes and shared envs/*.tfvars changes
          # force EVERY stack - workflow logic itself changed (want every
          # apply path exercised), and we can't cheaply attribute a shared
          # tfvars edit to one stack (this repo has already hit a real
          # shared-tfvars variable collision once - see terraform/README.md).
          FORCE_ALL='^(\.github/workflows/|\.github/actions/|terraform/envs/)'

          deploy_base=false
          matches "$CHANGED_BASE" "$FORCE_ALL|^terraform/stacks/base/|^terraform/modules/network/" && deploy_base=true

          deploy_n8n=false
          matches "$CHANGED_N8N" "$FORCE_ALL|^terraform/stacks/n8n/|^terraform/modules/n8n-ec2/|^terraform/modules/bedrock-access/" && deploy_n8n=true

          deploy_toolkit=false
          # database/ included: the toolkit image now depends on it as a real
          # uv path dependency (wusool-db), so a schema/model-only change must
          # trigger a toolkit rebuild+redeploy just like an app-code change.
          matches "$CHANGED_TOOLKIT" "$FORCE_ALL|^terraform/stacks/toolkit/|^terraform/modules/toolkit-ec2/|^terraform/modules/bedrock-access/|^workflows/wusool-toolkit/|^database/" && deploy_toolkit=true

          deploy_postgres=false
          matches "$CHANGED_POSTGRES" "$FORCE_ALL|^terraform/stacks/postgres/|^terraform/modules/postgres-rds/" && deploy_postgres=true

          # base owns the VPC/subnets/SNS topic every other stack reads via
          # terraform_remote_state. If base's outputs changed, n8n/toolkit/
          # postgres must re-apply too, or they keep acting on a stale base
          # output until something unrelated happens to redeploy them.
          if [ "$deploy_base" = "true" ]; then
            deploy_n8n=true
            deploy_toolkit=true
            deploy_postgres=true
          fi

          echo "deploy_base=$deploy_base" >> "$GITHUB_OUTPUT"
          echo "deploy_n8n=$deploy_n8n" >> "$GITHUB_OUTPUT"
          echo "deploy_toolkit=$deploy_toolkit" >> "$GITHUB_OUTPUT"
          echo "deploy_postgres=$deploy_postgres" >> "$GITHUB_OUTPUT"
          echo "::notice::deploy plan for $ENV — base=$deploy_base n8n=$deploy_n8n toolkit=$deploy_toolkit postgres=$deploy_postgres"

      # stacks/account is intentionally NOT applied here — it is account-wide,
      # not per-environment, and is applied out of band (no -var-file, no
      # environment concurrency group of its own). stacks/peering is the same
      # shape (spans both dev and prod VPCs) and is applied out of band too.
      #
      # ONE-TIME MIGRATION GATE (2026-08-17, dev-prod peering): the PR that
      # moved the public route table's default route from an inline `route`
      # block to a standalone `aws_route.internet` (modules/network/main.tf)
      # will make THIS apply fail with "RouteAlreadyExists" for dev and/or
      # prod unless the existing route has already been imported into that
      # new address first, per that file's MIGRATION NOTE:
      #   tofu import 'aws_route.internet' <public-route-table-id>_0.0.0.0/0
      # Run the import for whichever environment this job targets before
      # merging/re-running — this note can be deleted once both envs have
      # applied cleanly at least once past this change.

      - name: Apply stacks/base
        if: steps.detect.outputs.deploy_base == 'true'
        uses: ./.github/actions/tofu-apply-stack
        with:
          stack: base
          environment: ${{ env.ENV }}

      - name: Record base deployed SHA
        if: steps.detect.outputs.deploy_base == 'true'
        run: |
          aws ssm put-parameter --name "/wusool/$ENV/base/deployed_sha" \
            --value "${{ github.sha }}" --type String --overwrite

      - name: Apply stacks/n8n
        if: steps.detect.outputs.deploy_n8n == 'true'
        uses: ./.github/actions/tofu-apply-stack
        with:
          stack: n8n
          environment: ${{ env.ENV }}

      # -----------------------------------------------------------------
      # Same lesson as toolkit's rollout below, applied here for the first
      # time (code review 2026-08-16): a `tofu apply` on stacks/n8n only
      # registers a new bootstrap document — n8n's EC2 instance does not
      # rerun user_data on an existing instance, and nothing was re-invoking
      # the SSM association to actually push a user_data/Caddyfile/pinned-
      # image change to the running container. A merge changing any of
      # those would previously apply cleanly in Terraform while silently
      # never reaching the live n8n instance. `/healthz` confirmed live
      # (200) on both dev and prod before wiring this in.
      # -----------------------------------------------------------------

      - name: Roll the n8n app and wait for it
        if: steps.detect.outputs.deploy_n8n == 'true'
        id: n8n_bootstrap
        working-directory: terraform/stacks/n8n
        run: |
          set -uo pipefail
          DOC=$(tofu output -raw bootstrap_document_name 2>/dev/null || echo "")
          IID=$(tofu output -raw instance_id 2>/dev/null || echo "")
          if [ -z "$DOC" ] || [ -z "$IID" ]; then
            echo "::error::No n8n bootstrap_document_name/instance_id output — n8n should always have an instance"
            exit 1
          fi

          # Retried at this outer level, not just inside the bootstrap
          # script's own docker-compose retry: a brand-new instance's
          # automatic first-boot user_data execution can race with this
          # pipeline's explicit SSM re-invocation of the same script
          # (observed 2026-08-17 standing up the first prod toolkit
          # instance — a dnf package-cache collision, exit code from the
          # OS package layer entirely, before docker/app deployment even
          # starts). Retrying the whole send+poll cycle covers that and any
          # other transient bootstrap failure, not just docker compose's.
          for attempt in 1 2; do
            CMD=$(aws ssm send-command \
              --document-name "$DOC" --instance-ids "$IID" \
              --comment "deploy ${{ github.sha }} (attempt $attempt)" \
              --query Command.CommandId --output text)
            echo "command: $CMD (attempt $attempt/2)"

            STATUS=""
            for _ in $(seq 1 60); do
              STATUS=$(aws ssm get-command-invocation --command-id "$CMD" --instance-id "$IID" \
                    --query Status --output text 2>/dev/null || echo Pending)
              case "$STATUS" in
                Success) echo "bootstrap succeeded"; exit 0 ;;
                Failed|Cancelled|TimedOut) break ;;
              esac
              sleep 15
            done

            case "$STATUS" in
              Failed|Cancelled|TimedOut) ;;
              *) echo "::error::Bootstrap did not finish within 15 minutes"; exit 1 ;;
            esac

            echo "::warning::Bootstrap $STATUS on attempt $attempt/2"
            aws ssm get-command-invocation --command-id "$CMD" --instance-id "$IID" \
              --query StandardErrorContent --output text | tail -40
            [ "$attempt" -eq 2 ] && { echo "::error::Bootstrap failed after 2 attempts"; exit 1; }
            sleep 20
          done

      - name: Verify n8n actually serves
        if: steps.detect.outputs.deploy_n8n == 'true'
        working-directory: terraform/stacks/n8n
        run: |
          set -euo pipefail
          URL=$(tofu output -raw n8n_url 2>/dev/null || echo "")
          [ -n "$URL" ] || { echo "::error::No n8n_url output"; exit 1; }

          for i in $(seq 1 20); do
            C=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 "$URL/healthz" || echo 000)
            echo "attempt $i: HTTP $C"
            [ "$C" = "200" ] && { echo "healthy"; exit 0; }
            sleep 15
          done
          echo "::error::$URL/healthz never returned 200 — deploy is NOT healthy"; exit 1

      - name: Record n8n deployed SHA
        if: steps.detect.outputs.deploy_n8n == 'true'
        run: |
          aws ssm put-parameter --name "/wusool/$ENV/n8n/deployed_sha" \
            --value "${{ github.sha }}" --type String --overwrite

      - name: Apply stacks/toolkit
        if: steps.detect.outputs.deploy_toolkit == 'true'
        uses: ./.github/actions/tofu-apply-stack
        with:
          stack: toolkit
          environment: ${{ env.ENV }}
          extra_args: -var=image_digest=${{ inputs.image_digest }}

      # -----------------------------------------------------------------
      # RDS is private (publicly_accessible = false) — this runner has no
      # network path to it at all. The toolkit EC2 instance is the only
      # thing that does (same VPC), so migrations run there: a one-off
      # `docker run` of the exact image about to be deployed, via SSM
      # (AWS-RunShellScript — the account-wide document, not the custom
      # per-app bootstrap one; already permitted, since the deploy role
      # carries PowerUserAccess). Runs BEFORE the app is rolled to that same
      # image below — a migration failure must never leave new app code
      # running against a schema it expects but doesn't have yet.
      # -----------------------------------------------------------------

      - name: Run pending database migrations
        if: steps.detect.outputs.deploy_toolkit == 'true'
        id: migrate
        working-directory: terraform/stacks/toolkit
        run: |
          set -uo pipefail
          IID=$(tofu output -raw instance_id 2>/dev/null || echo "")
          REPO_URL=$(tofu output -raw ecr_repository_url 2>/dev/null || echo "")
          if [ -z "$IID" ]; then
            echo "::notice::No toolkit instance in $ENV (create_instance=false) — skipping migrations."
            exit 0
          fi
          IMAGE="$REPO_URL@${{ inputs.image_digest }}"

          # $REPO_URL/$IMAGE are expanded HERE (on the runner) into literal
          # values baked into the JSON below — the remote side needs no env
          # vars or secrets of its own beyond the app's already-deployed
          # .env.production (which already has DATABASE_URL, written by the
          # bootstrap script from the same secret the app itself reads).
          # Built via `jq -n` rather than a heredoc: a heredoc's closing
          # delimiter must match with zero leading whitespace, which a
          # YAML `run: |` block's indentation would silently break.
          COMMANDS_JSON=$(jq -n \
            --arg login "aws ecr get-login-password --region eu-central-1 | docker login --username AWS --password-stdin $REPO_URL" \
            --arg pull "docker pull $IMAGE" \
            --arg migrate "docker run --rm --env-file /opt/toolkit/toolkit/.env.production $IMAGE python -m alembic -c database/alembic.ini upgrade head" \
            '["set -e", $login, $pull, $migrate]')

          # Retried at this outer level, same as the bootstrap-roll steps
          # below: a brand-new instance's automatic first-boot user_data is
          # what writes /opt/toolkit/toolkit/.env.production in the first
          # place, and this command can race that on a genuinely first-ever
          # instance creation (see the "Roll the toolkit app" step's own
          # comment for the precedent — observed 2026-08-17 standing up the
          # first prod toolkit instance). Routine deploys to an
          # already-existing instance never hit this; only a fresh
          # create_instance=false -> true flip would.
          for attempt in 1 2; do
            CMD=$(aws ssm send-command \
              --document-name AWS-RunShellScript \
              --instance-ids "$IID" \
              --comment "alembic upgrade head ${{ github.sha }} (attempt $attempt)" \
              --parameters commands="$COMMANDS_JSON" \
              --query Command.CommandId --output text)
            echo "command: $CMD (attempt $attempt/2)"

            STATUS=""
            for _ in $(seq 1 40); do
              STATUS=$(aws ssm get-command-invocation --command-id "$CMD" --instance-id "$IID" \
                    --query Status --output text 2>/dev/null || echo Pending)
              case "$STATUS" in
                Success) echo "migration succeeded"; exit 0 ;;
                Failed|Cancelled|TimedOut) break ;;
              esac
              sleep 10
            done

            case "$STATUS" in
              Failed|Cancelled|TimedOut) ;;
              *) echo "::error::alembic upgrade head did not finish within ~6.5 minutes"; exit 1 ;;
            esac

            echo "::warning::alembic upgrade head $STATUS on attempt $attempt/2"
            echo "--- stdout ---"
            aws ssm get-command-invocation --command-id "$CMD" --instance-id "$IID" \
              --query StandardOutputContent --output text
            echo "--- stderr ---"
            aws ssm get-command-invocation --command-id "$CMD" --instance-id "$IID" \
              --query StandardErrorContent --output text
            [ "$attempt" -eq 2 ] && { echo "::error::alembic upgrade head FAILED after 2 attempts — aborting deploy before the app is rolled to the new image"; exit 1; }
            sleep 20
          done

      # -----------------------------------------------------------------
      # Everything below exists because `tofu apply` returning success proves
      # only that the SSM document was REGISTERED, not that the app deployed.
      # On 2026-08-16, three separate broken toolkit deploys reported
      # "Apply complete!" while the bootstrap actually failed. A deploy is not
      # done until the app is confirmed serving traffic.
      #
      # The `tofu apply` above already registered a bootstrap document
      # pointing at the new digest (via -var=image_digest=...). Re-running it
      # is what actually pulls that image and restarts the container — apply
      # alone only updates the registered document, it doesn't invoke it.
      # -----------------------------------------------------------------

      - name: Roll the toolkit app and wait for it
        if: steps.detect.outputs.deploy_toolkit == 'true'
        id: bootstrap
        working-directory: terraform/stacks/toolkit
        run: |
          set -uo pipefail
          DOC=$(tofu output -raw bootstrap_document_name 2>/dev/null || echo "")
          IID=$(tofu output -raw instance_id 2>/dev/null || echo "")
          if [ -z "$DOC" ] || [ -z "$IID" ]; then
            echo "::notice::No toolkit instance in $ENV (create_instance=false) — skipping app rollout."
            echo "skipped=true" >> "$GITHUB_OUTPUT"; exit 0
          fi

          # Retried at this outer level, not just inside the bootstrap
          # script's own docker-compose retry: a brand-new instance's
          # automatic first-boot user_data execution can race with this
          # pipeline's explicit SSM re-invocation of the same script
          # (observed 2026-08-17 standing up the first prod toolkit
          # instance — a dnf package-cache collision, exit code from the
          # OS package layer entirely, before docker/app deployment even
          # starts). Retrying the whole send+poll cycle covers that and any
          # other transient bootstrap failure, not just docker compose's.
          for attempt in 1 2; do
            CMD=$(aws ssm send-command \
              --document-name "$DOC" --instance-ids "$IID" \
              --comment "deploy ${{ github.sha }} (attempt $attempt)" \
              --query Command.CommandId --output text)
            echo "command: $CMD (attempt $attempt/2)"

            STATUS=""
            for _ in $(seq 1 60); do
              STATUS=$(aws ssm get-command-invocation --command-id "$CMD" --instance-id "$IID" \
                    --query Status --output text 2>/dev/null || echo Pending)
              case "$STATUS" in
                Success) echo "bootstrap succeeded"; exit 0 ;;
                Failed|Cancelled|TimedOut) break ;;
              esac
              sleep 15
            done

            case "$STATUS" in
              Failed|Cancelled|TimedOut) ;;
              *) echo "::error::Bootstrap did not finish within 15 minutes"; exit 1 ;;
            esac

            echo "::warning::Bootstrap $STATUS on attempt $attempt/2"
            aws ssm get-command-invocation --command-id "$CMD" --instance-id "$IID" \
              --query StandardErrorContent --output text | tail -40
            [ "$attempt" -eq 2 ] && { echo "::error::Bootstrap failed after 2 attempts"; exit 1; }
            sleep 20
          done

      - name: Verify the app actually serves
        if: steps.detect.outputs.deploy_toolkit == 'true' && steps.bootstrap.outputs.skipped != 'true'
        working-directory: terraform/stacks/toolkit
        run: |
          set -euo pipefail
          URL=$(tofu output -json app_urls 2>/dev/null | jq -r '.toolkit // empty')
          [ -n "$URL" ] || { echo "::notice::No app URL output — skipping health check."; exit 0; }

          # A successful bootstrap still leaves failure modes open: a container
          # can sit in `Created` when a port is already bound, which is exactly
          # what happened during the 2026-08-16 toolkit rename.
          for i in $(seq 1 20); do
            C=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 "$URL/health" || echo 000)
            echo "attempt $i: HTTP $C"
            [ "$C" = "200" ] && { echo "healthy"; exit 0; }
            sleep 15
          done
          echo "::error::$URL/health never returned 200 — deploy is NOT healthy"; exit 1

      # Written last, and only on success: recording it earlier would make a
      # failed deploy look deployed to the next run's change detection.
      - name: Record toolkit deployed SHA
        if: steps.detect.outputs.deploy_toolkit == 'true'
        run: |
          aws ssm put-parameter --name "/wusool/$ENV/toolkit/deployed_sha" \
            --value "${{ github.sha }}" --type String --overwrite

      - name: Apply stacks/postgres
        if: steps.detect.outputs.deploy_postgres == 'true'
        uses: ./.github/actions/tofu-apply-stack
        with:
          stack: postgres
          environment: ${{ env.ENV }}

      - name: Record postgres deployed SHA
        if: steps.detect.outputs.deploy_postgres == 'true'
        run: |
          aws ssm put-parameter --name "/wusool/$ENV/postgres/deployed_sha" \
            --value "${{ github.sha }}" --type String --overwrite
