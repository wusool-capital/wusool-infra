# First real CI coverage for the application code and operator scripts.
# Path-filtered: each job only runs when its own tree changes.
name: CI

on:
  pull_request:
    paths:
      - 'server/**'
      - 'infrastructure/**/scripts/**'
      - '.github/scripts/**'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

jobs:
  toolkit-python:
    name: wusool-toolkit (ruff, ty, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          version: latest

      - name: Install
        run: uv sync --dev

      - name: Ruff check
        run: uv run ruff check .

      # `ruff format --check` is deliberately NOT run yet: as of 2026-08-16 it
      # fails on 17 pre-existing files that were never run through the
      # formatter. Reformatting them is a real, separate cleanup — doing it as
      # a side effect of adding CI would bury that diff inside an infra
      # change. Add this check once that cleanup lands.

      - name: ty
        run: uv run ty check .

      - name: pytest
        env:
          DATABASE_URL: postgresql://user:pass@localhost:15432/wusool_crm
          SLACK_BOT_TOKEN: xoxb-test-token
          SLACK_SIGNING_SECRET: test-signing-secret
        run: uv run pytest

      - name: nightly resync orchestration shell test
        run: bash ../.github/scripts/tests/test-nightly-attio-resync.sh

  # Catches a broken migration or a model change that forgot one, on every
  # PR, against a real (throwaway) Postgres — distinct from and complementary
  # to _deploy.yml's "Run pending database migrations" step, which applies
  # migrations for real against dev/prod's actual RDS instance via SSM after
  # merge. This job never touches anything AWS-related; the service
  # container below is created and destroyed by the runner itself.
  alembic-check:
    name: Alembic drift check
    runs-on: ubuntu-latest
    services:
      postgres:
        # Same image as the local dev docker-compose db — needs pgvector for
        # buyer_intel.brief_embedding/vertical_kb.embedding's vector columns.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: matching
          POSTGRES_PASSWORD: matching
          POSTGRES_DB: wusool_crm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U matching -d wusool_crm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: server
    env:
      DATABASE_URL: postgresql://matching:matching@localhost:5432/wusool_crm
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          version: latest

      - name: Install
        run: uv sync

      # Runs against a genuinely empty database, same as production's first
      # bootstrap would — if this fails, `alembic upgrade head` would also
      # fail for real during a deploy, just later and against something
      # that matters.
      - name: alembic upgrade head
        run: uv run alembic upgrade head

      # Catches the class of bug Stage 1's models were drafted against
      # (static SQL analysis, not a live reflection): a model changed without
      # a matching migration, or a migration that doesn't actually produce
      # what the models declare.
      - name: alembic check (no undeclared drift between models and migrations)
        run: uv run alembic check

  # NOT dry-run locally (no pwsh on this machine) — unlike toolkit-python
  # above, which was verified end to end. Only fails on Severity=Error (not
  # Warning), since Error-level rules flag genuinely broken code rather than
  # style, making a false-positive break of working production scripts less
  # likely on this first run. If this job fails unexpectedly on existing
  # scripts, that is new information, not a known issue being ignored.
  powershell-lint:
    name: PSScriptAnalyzer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser
          $files = Get-ChildItem -Recurse -Include *.ps1 -Path server/scripts, infrastructure |
            Where-Object { $_.FullName -notmatch '[\\/]node_modules[\\/]' }
          $results = $files | ForEach-Object { Invoke-ScriptAnalyzer -Path $_.FullName -Severity Warning,Error }
          $results | Format-Table -AutoSize
          if ($results | Where-Object Severity -eq 'Error') {
            Write-Error "PSScriptAnalyzer found errors."
            exit 1
          }
