# Safety net for the dev+prod branching model's one real weakness: a hotfix
# committed directly to `prod` (Path B in the hotfix flow — see the plan doc)
# diverges prod from dev until something merges it back. Opens that PR
# automatically instead of relying on someone remembering.
#
# Runs after Deploy prod succeeds, not on every push to `prod` — a merge
# already headed to a broken deploy shouldn't also spam a back-merge PR.
name: Back-merge prod into dev

on:
  workflow_run:
    workflows: ["Deploy prod"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  backmerge:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Open prod -> dev PR if dev is behind
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch origin dev prod

          if git merge-base --is-ancestor origin/prod origin/dev; then
            echo "dev already has everything in prod — nothing to do."
            exit 0
          fi

          if gh pr list --base dev --head prod --state open --json number --jq 'length' | grep -qv '^0$'; then
            echo "A prod -> dev PR is already open."
            exit 0
          fi

          gh pr create --base dev --head prod \
            --title "Back-merge prod into dev" \
            --body "prod has commits dev does not (a hotfix merged directly, most likely). Merging this keeps dev from silently reverting it on the next promotion."
