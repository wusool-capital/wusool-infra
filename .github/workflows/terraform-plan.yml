# Plan on every PR, posted as a comment. Read-only credentials.
#
# One matrix cell per (environment, stack) — 8 today (2 envs x 4 per-env
# stacks) plus stacks/account (env-agnostic, no -var-file). Each stack has its
# own backend key, so each needs its own init + plan; there is no single
# monolithic root left to plan since Phase D's stacks split.
#
# Env selection follows the PR's BASE branch, not a fixed default: a
# dev -> prod promotion PR must show the PROD diff. Since prod has no
# approval gate, this comment is the only human review production receives -
# showing a dev plan there would make the guardrail silently useless.
name: Terraform plan

on:
  pull_request:
    paths: ['terraform/**']

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  plan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack: [base, n8n, toolkit, postgres]
    env:
      ENV: ${{ github.event.pull_request.base.ref == 'prod' && 'prod' || 'dev' }}
    steps:
      - uses: actions/checkout@v4

      - name: Read OpenTofu version
        id: tofu
        run: echo "version=$(tr -d '[:space:]' < terraform/.opentofu-version)" >> "$GITHUB_OUTPUT"

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ steps.tofu.outputs.version }}
          tofu_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::030179310793:role/wusool-gha-plan
          aws-region: eu-central-1

      - name: Plan
        id: plan
        working-directory: terraform/stacks/${{ matrix.stack }}
        run: |
          set -euo pipefail
          tofu init -reconfigure -input=false \
            -backend-config=bucket=wusool-tfstate \
            -backend-config=region=me-central-1 \
            -backend-config=key=wusool/$ENV/${{ matrix.stack }}/terraform.tfstate \
            -backend-config=use_lockfile=true -backend-config=encrypt=true
          tofu plan -input=false -lock=false -no-color -var-file=../../envs/$ENV.tfvars \
            > /tmp/plan.txt 2>&1 || true
          tail -c 60000 /tmp/plan.txt > /tmp/plan-short.txt

          # Only comment when the plan actually changes something — a clean
          # "No changes" on every stack for every PR is noise, not signal.
          if grep -q '^No changes' /tmp/plan.txt; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "has_changes=true" >> "$GITHUB_OUTPUT"

          {
            echo 'body<<PLANEOF'
            echo "### \`$ENV\` / \`${{ matrix.stack }}\` plan"
            grep -E '^Plan:' /tmp/plan.txt | head -1 || true
            if grep -q 'forces replacement\|will be destroyed' /tmp/plan.txt; then
              echo ''
              echo '> **This plan DESTROYS or REPLACES resources — read it carefully.**'
            fi
            echo ''
            echo '<details><summary>full plan</summary>'
            echo ''
            echo '```terraform'
            cat /tmp/plan-short.txt
            echo '```'
            echo '</details>'
            echo PLANEOF
          } >> "$GITHUB_OUTPUT"

      # The plan body is passed via env, not spliced into the script string:
      # a plan full of Terraform's own `${...}` syntax and backticked code
      # fences breaks a JS template literal it's interpolated into (hit this
      # on 2026-08-16 — every plan job failed at this step with a JS
      # SyntaxError even though the plan itself succeeded).
      - if: steps.plan.outputs.has_changes == 'true'
        uses: actions/github-script@v7
        env:
          PLAN_BODY: ${{ steps.plan.outputs.body }}
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: process.env.PLAN_BODY
            })

  plan-account:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read OpenTofu version
        id: tofu
        run: echo "version=$(tr -d '[:space:]' < terraform/.opentofu-version)" >> "$GITHUB_OUTPUT"

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ steps.tofu.outputs.version }}
          tofu_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::030179310793:role/wusool-gha-plan
          aws-region: eu-central-1

      # No -var-file: stacks/account is account-wide, not per-environment.
      - name: Plan
        id: plan
        working-directory: terraform/stacks/account
        run: |
          set -euo pipefail
          tofu init -reconfigure -input=false \
            -backend-config=bucket=wusool-tfstate \
            -backend-config=region=me-central-1 \
            -backend-config=key=wusool/account/terraform.tfstate \
            -backend-config=use_lockfile=true -backend-config=encrypt=true
          tofu plan -input=false -lock=false -no-color > /tmp/plan.txt 2>&1 || true
          tail -c 60000 /tmp/plan.txt > /tmp/plan-short.txt

          # Only comment when the plan actually changes something — a clean
          # "No changes" on every stack for every PR is noise, not signal.
          if grep -q '^No changes' /tmp/plan.txt; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "has_changes=true" >> "$GITHUB_OUTPUT"

          {
            echo 'body<<PLANEOF'
            echo "### \`account\` plan"
            grep -E '^Plan:' /tmp/plan.txt | head -1 || true
            if grep -q 'forces replacement\|will be destroyed' /tmp/plan.txt; then
              echo ''
              echo '> **This plan DESTROYS or REPLACES resources — read it carefully.**'
            fi
            echo ''
            echo '<details><summary>full plan</summary>'
            echo ''
            echo '```terraform'
            cat /tmp/plan-short.txt
            echo '```'
            echo '</details>'
            echo PLANEOF
          } >> "$GITHUB_OUTPUT"

      # The plan body is passed via env, not spliced into the script string:
      # a plan full of Terraform's own `${...}` syntax and backticked code
      # fences breaks a JS template literal it's interpolated into (hit this
      # on 2026-08-16 — every plan job failed at this step with a JS
      # SyntaxError even though the plan itself succeeded).
      - if: steps.plan.outputs.has_changes == 'true'
        uses: actions/github-script@v7
        env:
          PLAN_BODY: ${{ steps.plan.outputs.body }}
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: process.env.PLAN_BODY
            })
