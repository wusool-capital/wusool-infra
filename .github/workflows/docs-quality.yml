name: Documentation quality

on:
  pull_request:
    paths:
      - 'CHANGELOG.md'
      - 'gitbook/**'
      - '.vale.ini'
      - '.github/styles/**'
      - '.github/workflows/docs-quality.yml'
      - 'docs/**'
  push:
    branches:
      - dev
      - prod
    paths:
      - 'CHANGELOG.md'
      - 'gitbook/**'
      - '.vale.ini'
      - '.github/styles/**'
      - '.github/workflows/docs-quality.yml'
      - 'docs/**'

permissions:
  contents: read

jobs:
  vale:
    name: Vale documentation quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: vale-cli/vale-action@v3
        with:
          version: 3.17.0
          sync: false
          fail_level: warning
          files: '["CHANGELOG.md", "gitbook/README.md", "gitbook/SUMMARY.md", "gitbook/user-guide", "gitbook/technical", "gitbook/operations", "gitbook/deliverables"]'
