name: Terraform CI

on:
  pull_request:
    branches:
      - dev
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: OpenTofu Format
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - uses: ./.github/actions/setup-opentofu

      - name: Check OpenTofu formatting
        run: tofu fmt -check -recursive -diff
        working-directory: infrastructure/terraform

  validate:
    name: OpenTofu Validate (${{ matrix.root }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        root:
          - infrastructure/terraform/stacks/account
          - infrastructure/terraform/stacks/base
          - infrastructure/terraform/stacks/n8n
          - infrastructure/terraform/stacks/toolkit
          - infrastructure/terraform/stacks/postgres
          - infrastructure/terraform/stacks/peering
          - infrastructure/terraform/stacks/scribe-updates

    defaults:
      run:
        working-directory: ${{ matrix.root }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - uses: ./.github/actions/setup-opentofu

      - name: Initialize without remote backend
        run: tofu init -backend=false -input=false

      - name: Validate Terraform
        run: tofu validate -no-color
