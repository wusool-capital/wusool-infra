name: Terraform CI

on:
  pull_request:
    branches:
      - dev
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Terraform Format
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read Terraform version
        id: terraform-version
        shell: bash
        run: echo "version=$(tr -d '[:space:]' < terraform/.terraform-version)" >> "$GITHUB_OUTPUT"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ steps.terraform-version.outputs.version }}
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive -diff
        working-directory: terraform

  validate:
    name: Terraform Validate (${{ matrix.root }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        root:
          - terraform/bootstrap
          - terraform/environments/dev
          - terraform/environments/prod

    defaults:
      run:
        working-directory: ${{ matrix.root }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read Terraform version
        id: terraform-version
        shell: bash
        working-directory: ${{ github.workspace }}
        run: echo "version=$(tr -d '[:space:]' < terraform/.terraform-version)" >> "$GITHUB_OUTPUT"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ steps.terraform-version.outputs.version }}
          terraform_wrapper: false

      - name: Initialize without remote backend
        run: terraform init -backend=false -input=false

      - name: Validate Terraform
        run: terraform validate -no-color
