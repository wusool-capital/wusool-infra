name: Terraform CI

on:
  pull_request:
    branches:
      - dev
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: OpenTofu Format
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read OpenTofu version
        id: tofu-version
        shell: bash
        run: echo "version=$(tr -d '[:space:]' < terraform/.opentofu-version)" >> "$GITHUB_OUTPUT"

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ steps.tofu-version.outputs.version }}
          tofu_wrapper: false

      - name: Check OpenTofu formatting
        run: tofu fmt -check -recursive -diff
        working-directory: terraform

  validate:
    name: OpenTofu Validate (${{ matrix.root }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        root:
          - terraform/bootstrap
          - terraform/stacks/account
          - terraform/stacks/base
          - terraform/stacks/n8n
          - terraform/stacks/toolkit
          - terraform/stacks/postgres

    defaults:
      run:
        working-directory: ${{ matrix.root }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read OpenTofu version
        id: tofu-version
        shell: bash
        working-directory: ${{ github.workspace }}
        run: echo "version=$(tr -d '[:space:]' < terraform/.opentofu-version)" >> "$GITHUB_OUTPUT"

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ steps.tofu-version.outputs.version }}
          tofu_wrapper: false

      - name: Initialize without remote backend
        run: tofu init -backend=false -input=false

      - name: Validate Terraform
        run: tofu validate -no-color
