# PROD deploys. Merging `dev` -> `prod` resolves the image dev already ran and
# deploys that exact digest. It NEVER builds.
#
# A normal (non-squash) merge is required: prod resolves the promoted commit as
# HEAD^2, the merge commit's second parent, which is dev's tip. A squash merge
# destroys that parent and the digest cannot be resolved - the run then fails
# loudly rather than deploying something untested.
name: Deploy prod

on:
  push:
    branches: [prod]
    paths:
      - 'terraform/**'
      - 'workflows/wusool-toolkit/**'
      - '.github/workflows/deploy-prod.yml'
      - '.github/workflows/_deploy.yml'
  workflow_dispatch:
    inputs:
      image_digest:
        description: 'Emergency override: deploy this digest instead of resolving it.'
        required: false
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.find.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::030179310793:role/wusool-gha-apply-prod
          aws-region: eu-central-1

      - name: Resolve the digest dev already validated
        id: find
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.image_digest }}" ]; then
            echo "::warning::Using an operator-supplied digest — this bypasses the dev-validation guarantee."
            echo "digest=${{ inputs.image_digest }}" >> "$GITHUB_OUTPUT"; exit 0
          fi

          # HEAD^2 = dev's tip for a merge commit; fall back to HEAD if the merge
          # fast-forwarded (nothing had landed on prod since the last promotion).
          SHA=$(git rev-parse --short "HEAD^2" 2>/dev/null || git rev-parse --short HEAD)
          echo "promoted commit: $SHA"

          DIGEST=$(aws ecr describe-images --repository-name wusool/toolkit \
            --image-ids imageTag="sha-$SHA" --query 'imageDetails[0].imageDigest' \
            --output text 2>/dev/null || echo "")

          if [ -z "$DIGEST" ] || [ "$DIGEST" = "None" ]; then
            echo "::error::No image for sha-$SHA. This commit never went through dev, or the dev build failed. Refusing to deploy something untested — re-run with an explicit image_digest only if you are certain."
            exit 1
          fi
          echo "resolved: $DIGEST"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

  deploy:
    needs: resolve
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: prod
      role_arn: arn:aws:iam::030179310793:role/wusool-gha-apply-prod
      image_digest: ${{ needs.resolve.outputs.digest }}
