# PROD deploys. Merging to `prod` builds prod's own image and rolls it out.
#
# Deliberately a separate file from deploy-dev.yml, and prod builds its own
# artifact into its own ECR repository rather than promoting dev's. The two
# environments share no registry and no build output.
#
# Consequence to be aware of: prod's image is built from prod's source at prod's
# build time, so it is not guaranteed byte-identical to what dev tested.
# `uv.lock` pins the Python dependencies; pin the Dockerfile's base images by
# digest to close the remaining gap.
name: Deploy prod

on:
  push:
    branches: [prod]
    paths:
      - 'terraform/**'
      - 'workflows/wusool-toolkit/**'
      - '.github/workflows/deploy-prod.yml'
      - '.github/workflows/_deploy.yml'
      - '.github/workflows/_build.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    uses: ./.github/workflows/_build.yml
    with:
      environment: prod
      role_arn: arn:aws:iam::030179310793:role/wusool-gha-apply-prod

  deploy:
    needs: build
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: prod
      role_arn: arn:aws:iam::030179310793:role/wusool-gha-apply-prod
      image_digest: ${{ needs.build.outputs.digest }}
