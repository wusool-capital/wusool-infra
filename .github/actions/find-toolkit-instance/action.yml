name: Find the current toolkit instance
description: >
  Looks up the currently running wusool-<env>-toolkit EC2 instance by its
  Name tag. The instance is ASG-managed (infrastructure/terraform/modules/toolkit-ec2)
  and can be replaced at any time, independent of any `tofu apply` — there is
  no stable instance_id Terraform output any more, so every consumer that
  needs the live instance ID looks it up the same way, here, instead of each
  reimplementing the same aws ec2 describe-instances call.

inputs:
  environment:
    description: 'dev or prod'
    required: true

outputs:
  instance_id:
    description: 'The running instance ID, or empty string only when no toolkit ASG exists (create_instance=false). Fails if the ASG exists without a running instance.'
    value: ${{ steps.find.outputs.instance_id }}

runs:
  using: composite
  steps:
    - id: find
      shell: bash
      run: |
        set -euo pipefail
        IID=$("$GITHUB_WORKSPACE/.github/scripts/find-toolkit-instance.sh" "${{ inputs.environment }}")
        echo "instance_id=$IID" >> "$GITHUB_OUTPUT"
