# Alembic config for wusool_crm's schema, owned by this repo (wusool-infra).
#
# Modeled directly on wusool-scribe's own alembic.ini. Scribe's chain runs
# against its own separate, standalone Postgres, not wusool_crm — so there's
# no shared alembic_version bookkeeping to collide with here.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os

# Consumed by env.py only, and overwritten there at runtime from the
# DATABASE_URL environment variable — the same secret value
# (/wusool/<env>/toolkit's `database_url`) the toolkit app itself already
# reads. This placeholder is intentionally never a real credential and is
# never used directly; see env.py's _database_url().
sqlalchemy.url = postgresql+asyncpg://user:pass@localhost:5432/wusool_crm

[post_write_hooks]
hooks = ruff
ruff.type = exec
ruff.executable = ruff
ruff.options = check --fix REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
