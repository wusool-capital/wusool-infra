[project]
name = "wusool-db"
version = "0.1.0"
description = "Single source of truth for every SQLAlchemy model mapping onto the wusool_crm database. Consumed as a path dependency by matching-engine and ddl-commands; also the future home of the Alembic migration chain (Stage 3+)."
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0.35",
    # For `buyer_intel.brief_embedding`/`vertical_kb.embedding` (both
    # conditional `vector(1536)` columns — see those models' docstrings).
    # Not used anywhere else in this repo before this dependency was added;
    # 0.3.6 is a recent-as-of-writing floor, matching this file's existing
    # `>=`-floor style rather than a hard pin.
    "pgvector>=0.3.6",
    # A real runtime dependency, not a dev tool: `alembic upgrade head` runs
    # inside the deployed toolkit container itself (RDS is private, so CI
    # has no direct network path to it — see .github/workflows/_deploy.yml's
    # "Run pending database migrations" step). Must therefore be installed
    # wherever wusool-db is installed, not gated behind an optional extra.
    "alembic>=1.13",
    # matching-engine/ddl-commands already use the asyncpg driver
    # (postgresql+asyncpg://) — env.py mirrors that exact convention rather
    # than introducing a second, sync driver just for migrations.
    "asyncpg>=0.29",
]

[project.optional-dependencies]
# Local revision-authoring convenience only — alembic.ini's
# [post_write_hooks] runs `ruff check --fix` on every generated revision
# file. Never needed by `alembic upgrade head` (post_write_hooks only fire
# on `alembic revision`), so it's kept out of the deployed image. Install
# with `uv sync --extra dev` from this directory when authoring migrations.
dev = [
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wusool_db"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
