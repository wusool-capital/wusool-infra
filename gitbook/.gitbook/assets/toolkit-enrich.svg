<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 720 592" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="toolkit-enrich-title toolkit-enrich-desc" id="toolkit-enrich-root">
        <title id="toolkit-enrich-title">How /enrich-buyer and /enrich-seller work</title>
        <desc id="toolkit-enrich-desc">Flowchart: the bot researches public sources and proposes values; you review and submit them, and only reviewed values are saved.</desc>
        <defs>
      <style>#toolkit-enrich-root { font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; color: #000523; }
      #toolkit-enrich-root .diagram-container { width: 100%; overflow-x: auto; }
      #toolkit-enrich-root .diagram-container { overflow-x: visible; }</style>
          <marker id="toolkit-enrich-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#56596b"/></marker>
          <marker id="toolkit-enrich-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#336a85"/></marker>
          <marker id="toolkit-enrich-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#336a85"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f7f5f0"/>
<line x1="260" y1="64" x2="260" y2="96" stroke="#56596b" stroke-width="1.2" marker-end="url(#toolkit-enrich-arrow)"/>
