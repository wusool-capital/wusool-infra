<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 720 568" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="toolkit-profile-save-title toolkit-profile-save-desc" id="toolkit-profile-save-root">
        <title id="toolkit-profile-save-title">How a profile command saves</title>
        <desc id="toolkit-profile-save-desc">Flowchart: check the role is new, write to Attio first, then write to the database in one transaction; a partial Attio write leaves the database alone and names what landed.</desc>
        <defs>
      <style>#toolkit-profile-save-root { font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; color: #000523; }
      #toolkit-profile-save-root .diagram-container { width: 100%; overflow-x: auto; }
      #toolkit-profile-save-root .diagram-container { overflow-x: visible; }</style>
          <marker id="toolkit-profile-save-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#56596b"/></marker>
          <marker id="toolkit-profile-save-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#336a85"/></marker>
          <marker id="toolkit-profile-save-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#336a85"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f7f5f0"/>
