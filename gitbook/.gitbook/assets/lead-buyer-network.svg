<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 720 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lead-buyer-network-title lead-buyer-network-desc" id="lead-buyer-network-root">
        <title id="lead-buyer-network-title">How a Buyer Network application is handled</title>
        <desc id="lead-buyer-network-desc">Flowchart: validate the form, record and confirm at once, then in the background write a Bedrock qualification note, the Attio records, and the two emails.</desc>
        <defs>
      <style>#lead-buyer-network-root { font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; color: #000523; }
      #lead-buyer-network-root .diagram-container { width: 100%; overflow-x: auto; }
      #lead-buyer-network-root .diagram-container { overflow-x: visible; }</style>
          <marker id="lead-buyer-network-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#56596b"/></marker>
          <marker id="lead-buyer-network-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#336a85"/></marker>
          <marker id="lead-buyer-network-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#336a85"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f7f5f0"/>
<line x1="260" y1="64" x2="260" y2="96" stroke="#56596b" stroke-width="1.2" marker-end="url(#lead-buyer-network-arrow)"/>
<line x1="260" y1="144" x2="260" y2="176" stroke="#56596b" stroke-width="1.2" marker-end="url(#lead-buyer-network-arrow)"/>
<line x1="260" y1="224" x2="260" y2="256" stroke="#56596b" stroke-width="1.2" marker-end="url(#lead-buyer-network-arrow)"/>
<line x1="260" y1="304" x2="260" y2="336" stroke="#56596b" stroke-width="1.2" marker-end="url(#lead-buyer-network-arrow)"/>
<line x1="260" y1="384" x2="260" y2="416" stroke="#56596b" stroke-width="1.2" marker-end="url(#lead-buyer-network-arrow)"/>
<line x1="260" y1="464" x2="260" y2="496" stroke="#336a85" stroke-width="1.4" marker-end="url(#lead-buyer-network-arrow-accent)"/>
<rect x="140" y="24" width="240" height="40" rx="20" fill="#f7f5f0"/>
<rect x="140" y="24" width="240" height="40" rx="20" fill="#000523" fill-opacity="0.03" stroke="#000523" stroke-opacity="0.30" stroke-width="1"/>
<text x="260" y="48" fill="#000523" font-size="12" font-weight="600" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">Buyer applies</text>
<rect x="140" y="96" width="240" height="48" rx="6" fill="#ffffff" stroke="#000523" stroke-width="1"/>
<text x="260" y="117" fill="#000523" font-size="12" font-weight="600" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">Validate the form</text>
<text x="260" y="131" fill="#56596b" font-size="9" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle">types · geographies · sectors</text>
<rect x="140" y="176" width="240" height="48" rx="6" fill="#ffffff" stroke="#000523" stroke-width="1"/>
<text x="260" y="197" fill="#000523" font-size="12" font-weight="600" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">Record and confirm</text>
<text x="260" y="211" fill="#56596b" font-size="9" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle">tool_runs · applicant sees thanks</text>
<rect x="140" y="256" width="240" height="48" rx="6" fill="#ffffff" stroke="#000523" stroke-width="1"/>
<text x="260" y="277" fill="#000523" font-size="12" font-weight="600" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">Write a qualification note</text>
<text x="260" y="291" fill="#56596b" font-size="9" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle">Bedrock · never blocks</text>
<rect x="140" y="336" width="240" height="48" rx="6" fill="#ffffff" stroke="#000523" stroke-width="1"/>
<text x="260" y="357" fill="#000523" font-size="12" font-weight="600" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">Write to Attio</text>
<text x="260" y="371" fill="#56596b" font-size="9" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle">org · a buyer role per sector · deal</text>
<rect x="140" y="416" width="240" height="48" rx="6" fill="#ffffff" stroke="#000523" stroke-width="1"/>
<text x="260" y="437" fill="#000523" font-size="12" font-weight="600" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">Send both emails</text>
<text x="260" y="451" fill="#56596b" font-size="9" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle">confirmation + team notice</text>
<rect x="140" y="496" width="240" height="48" rx="20" fill="#f7f5f0"/>
<rect x="140" y="496" width="240" height="48" rx="20" fill="#c6e1ee" stroke="#336a85" stroke-width="1"/>
<text x="260" y="524" fill="#000523" font-size="12" font-weight="600" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">Application complete</text>
<line x1="24" y1="584" x2="696" y2="584" stroke="#000523" stroke-opacity="0.10" stroke-width="0.8"/>
<text x="24" y="600" fill="#56596b" font-size="8" font-family="'Geist Mono', ui-monospace, Menlo, monospace" letter-spacing="0.18em">LEGEND</text>
<rect x="24" y="612" width="24" height="12" rx="6" fill="#000523" fill-opacity="0.03" stroke="#000523" stroke-opacity="0.30" stroke-width="1"/>
<text x="56" y="621" fill="#56596b" font-size="9" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif">Start / end</text>
<rect x="144" y="612" width="24" height="12" rx="2" fill="#ffffff" stroke="#000523" stroke-width="1"/>
<text x="176" y="621" fill="#56596b" font-size="9" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif">Step</text>
<polygon points="228,618 240,612 252,618 240,624" fill="#ffffff" stroke="#000523" stroke-width="1"/>
<text x="260" y="621" fill="#56596b" font-size="9" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif">Decision</text>
<line x1="332" y1="618" x2="356" y2="618" stroke="#336a85" stroke-width="1.4" marker-end="url(#lead-buyer-network-arrow-accent)"/>
<text x="364" y="621" fill="#56596b" font-size="9" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif">Main path</text>
