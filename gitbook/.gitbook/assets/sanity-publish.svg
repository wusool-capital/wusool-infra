<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 720 784" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sanity-publish-title sanity-publish-desc" id="sanity-publish-root">
        <title id="sanity-publish-title">How a Sanity publish reaches the website</title>
        <desc id="sanity-publish-desc">Flowchart: Sanity sends a signed webhook, the server replies 202 and syncs in the background, rendering and carding reports or sanitizing articles for Webflow.</desc>
        <defs>
      <style>#sanity-publish-root { font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; color: #000523; }
      #sanity-publish-root .diagram-container { width: 100%; overflow-x: auto; }
      #sanity-publish-root .diagram-container { overflow-x: visible; }</style>
