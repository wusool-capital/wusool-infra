<text x="260" y="309" fill="#000523" font-size="12" font-weight="600" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">Reply 202, sync in background</text>
<text x="260" y="323" fill="#56596b" font-size="9" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle">Sanity never times out</text>
<polygon points="260,368 364,408 260,448 156,408" fill="#ffffff" stroke="#000523" stroke-width="1"/>
