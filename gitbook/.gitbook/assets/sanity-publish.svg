<text x="260" y="515" fill="#56596b" font-size="9" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle">network blocked · 30 s cap</text>
<rect x="140" y="560" width="240" height="48" rx="6" fill="#ffffff" stroke="#000523" stroke-width="1"/>
<text x="260" y="581" fill="#000523" font-size="12" font-weight="600" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">Create or update the card</text>
<text x="260" y="595" fill="#56596b" font-size="9" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle">Webflow Reports · pins synced</text>
<rect x="140" y="640" width="240" height="48" rx="20" fill="#f7f5f0"/>
<rect x="140" y="640" width="240" height="48" rx="20" fill="#c6e1ee" stroke="#336a85" stroke-width="1"/>
<text x="260" y="668" fill="#000523" font-size="12" font-weight="600" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">Live on the website</text>
<line x1="24" y1="728" x2="696" y2="728" stroke="#000523" stroke-opacity="0.10" stroke-width="0.8"/>
<text x="24" y="744" fill="#56596b" font-size="8" font-family="'Geist Mono', ui-monospace, Menlo, monospace" letter-spacing="0.18em">LEGEND</text>
