<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 720 752" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lead-benchmark-title lead-benchmark-desc" id="lead-benchmark-root">
        <title id="lead-benchmark-title">How a benchmark result is produced</title>
        <desc id="lead-benchmark-desc">Flowchart: record the submission, score against the peer dataset with no AI, add an implied enterprise value in tech mode, show the result, then write triage fields to Attio.</desc>
        <defs>
