        <title id="toolkit-enrichment-waterfall-title">How enrichment finds values</title>
        <desc id="toolkit-enrichment-waterfall-desc">Flowchart: list the empty fields, ask Diffbot, then People Data Labs for what it missed, then a web search with Bedrock as the last resort, and post a proposal to review.</desc>
