<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 720 592" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="security-checks-title security-checks-desc" id="security-checks-root">
        <title id="security-checks-title">How an inbound request is checked</title>
        <desc id="security-checks-desc">Flowchart: verify the sender by signature or key, reject failures before any work, apply origin and rate checks, then run the handler with scoped credentials.</desc>
        <defs>
      <style>#security-checks-root { font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; color: #000523; }
      #security-checks-root .diagram-container { width: 100%; overflow-x: auto; }
      #security-checks-root .diagram-container { overflow-x: visible; }</style>
          <marker id="security-checks-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#56596b"/></marker>
          <marker id="security-checks-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#336a85"/></marker>
          <marker id="security-checks-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#336a85"/></marker>
        </defs>
