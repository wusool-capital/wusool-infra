<rect x="390" y="196" width="24" height="12" rx="2" fill="#f7f5f0"/>
<text x="402" y="205" fill="#636575" font-size="8" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">NO</text>
