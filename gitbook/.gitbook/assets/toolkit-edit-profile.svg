<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 720 488" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="toolkit-edit-profile-title toolkit-edit-profile-desc" id="toolkit-edit-profile-root">
        <title id="toolkit-edit-profile-title">How /edit-buyer and /edit-seller work</title>
        <desc id="toolkit-edit-profile-desc">Flowchart: pick the record and fields, update the pre-filled form, and save to Attio; a partial save tells you which part was saved.</desc>
        <defs>
      <style>#toolkit-edit-profile-root { font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; color: #000523; }
      #toolkit-edit-profile-root .diagram-container { width: 100%; overflow-x: auto; }
      #toolkit-edit-profile-root .diagram-container { overflow-x: visible; }</style>
          <marker id="toolkit-edit-profile-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#56596b"/></marker>
          <marker id="toolkit-edit-profile-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#336a85"/></marker>
          <marker id="toolkit-edit-profile-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#336a85"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f7f5f0"/>
<line x1="260" y1="64" x2="260" y2="96" stroke="#56596b" stroke-width="1.2" marker-end="url(#toolkit-edit-profile-arrow)"/>
<line x1="260" y1="144" x2="260" y2="176" stroke="#56596b" stroke-width="1.2" marker-end="url(#toolkit-edit-profile-arrow)"/>
<line x1="260" y1="224" x2="260" y2="256" stroke="#56596b" stroke-width="1.2" marker-end="url(#toolkit-edit-profile-arrow)"/>
<line x1="356" y1="296" x2="440" y2="296" stroke="#56596b" stroke-width="1.2" marker-end="url(#toolkit-edit-profile-arrow)"/>
<line x1="260" y1="336" x2="260" y2="368" stroke="#336a85" stroke-width="1.4" marker-end="url(#toolkit-edit-profile-arrow-accent)"/>
<rect x="386" y="276" width="24" height="12" rx="2" fill="#f7f5f0"/>
<text x="398" y="285" fill="#636575" font-size="8" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">NO</text>
<rect x="268" y="346" width="28" height="12" rx="2" fill="#f7f5f0"/>
<text x="282" y="355" fill="#336a85" font-size="8" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">YES</text>
<rect x="136" y="24" width="248" height="40" rx="20" fill="#f7f5f0"/>
<rect x="136" y="24" width="248" height="40" rx="20" fill="#000523" fill-opacity="0.03" stroke="#000523" stroke-opacity="0.30" stroke-width="1"/>
<text x="260" y="48" fill="#000523" font-size="12" font-weight="600" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">/edit-buyer or /edit-seller</text>
<rect x="152" y="96" width="216" height="48" rx="6" fill="#ffffff" stroke="#000523" stroke-width="1"/>
<text x="260" y="117" fill="#000523" font-size="12" font-weight="600" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">Pick the record</text>
<text x="260" y="131" fill="#56596b" font-size="9" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle">and the fields to change</text>
<rect x="152" y="176" width="216" height="48" rx="6" fill="#ffffff" stroke="#000523" stroke-width="1"/>
<text x="260" y="197" fill="#000523" font-size="12" font-weight="600" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">Update the form</text>
<text x="260" y="211" fill="#56596b" font-size="9" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle">pre-filled · press Save</text>
<polygon points="260,256 356,296 260,336 164,296" fill="#ffffff" stroke="#000523" stroke-width="1"/>
<text x="260" y="300" fill="#000523" font-size="12" font-weight="600" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">Saved in full?</text>
<rect x="440" y="272" width="216" height="48" rx="6" fill="#ffffff" stroke="#000523" stroke-width="1"/>
<text x="548" y="293" fill="#000523" font-size="12" font-weight="600" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">Bot lists what saved</text>
<text x="548" y="307" fill="#56596b" font-size="9" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle">fix the rest, save again</text>
<rect x="152" y="368" width="216" height="48" rx="20" fill="#f7f5f0"/>
<rect x="152" y="368" width="216" height="48" rx="20" fill="#c6e1ee" stroke="#336a85" stroke-width="1"/>
<text x="260" y="389" fill="#000523" font-size="12" font-weight="600" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">Saved to Attio</text>
<text x="260" y="403" fill="#56596b" font-size="9" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle">bot confirms</text>
<line x1="24" y1="432" x2="696" y2="432" stroke="#000523" stroke-opacity="0.10" stroke-width="0.8"/>
<text x="24" y="448" fill="#56596b" font-size="8" font-family="'Geist Mono', ui-monospace, Menlo, monospace" letter-spacing="0.18em">LEGEND</text>
<rect x="24" y="460" width="24" height="12" rx="6" fill="#000523" fill-opacity="0.03" stroke="#000523" stroke-opacity="0.30" stroke-width="1"/>
<text x="56" y="469" fill="#56596b" font-size="9" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif">Start / end</text>
<rect x="144" y="460" width="24" height="12" rx="2" fill="#ffffff" stroke="#000523" stroke-width="1"/>
<text x="176" y="469" fill="#56596b" font-size="9" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif">Step</text>
<polygon points="228,466 240,460 252,466 240,472" fill="#ffffff" stroke="#000523" stroke-width="1"/>
<text x="260" y="469" fill="#56596b" font-size="9" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif">Decision</text>
<line x1="332" y1="466" x2="356" y2="466" stroke="#336a85" stroke-width="1.4" marker-end="url(#toolkit-edit-profile-arrow-accent)"/>
<text x="364" y="469" fill="#56596b" font-size="9" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif">Main path</text>
      </svg>
