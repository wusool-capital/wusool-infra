        <title id="attio-resync-title">How the nightly resync runs</title>
        <desc id="attio-resync-desc">Flowchart: a scheduled workflow signs in, runs the resync inside the Toolkit container over SSM, reconciles each object, checks counts, and alerts on failure.</desc>
