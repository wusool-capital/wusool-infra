        <title id="platform-infrastructure-title">Wusool platform infrastructure</title>
        <desc id="platform-infrastructure-desc">Architecture: clients reach the Wusool Toolkit container on EC2, which uses Bedrock, SES and a private PostgreSQL database in AWS, calls Attio, Webflow and research APIs, and receives their webhooks; n8n runs on its own instance.</desc>
