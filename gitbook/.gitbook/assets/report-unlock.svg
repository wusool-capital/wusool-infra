<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 720 784" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="report-unlock-title report-unlock-desc" id="report-unlock-root">
        <title id="report-unlock-title">How a reader unlocks a report</title>
        <desc id="report-unlock-desc">Flowchart: show the first page, let returning readers through, otherwise email a 6-digit code, check it, record the reader, and open the full report and PDF.</desc>
        <defs>
      <style>#report-unlock-root { font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; color: #000523; }
      #report-unlock-root .diagram-container { width: 100%; overflow-x: auto; }
      #report-unlock-root .diagram-container { overflow-x: visible; }</style>
          <marker id="report-unlock-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#56596b"/></marker>
          <marker id="report-unlock-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#336a85"/></marker>
          <marker id="report-unlock-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#336a85"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f7f5f0"/>
