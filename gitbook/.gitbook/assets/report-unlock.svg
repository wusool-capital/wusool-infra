<line x1="260" y1="416" x2="260" y2="448" stroke="#56596b" stroke-width="1.2" marker-end="url(#report-unlock-arrow)"/>
<line x1="364" y1="488" x2="440" y2="488" stroke="#56596b" stroke-width="1.2" marker-end="url(#report-unlock-arrow)"/>
<line x1="260" y1="528" x2="260" y2="560" stroke="#56596b" stroke-width="1.2" marker-end="url(#report-unlock-arrow)"/>
<line x1="260" y1="608" x2="260" y2="640" stroke="#336a85" stroke-width="1.4" marker-end="url(#report-unlock-arrow-accent)"/>
<rect x="388" y="196" width="28" height="12" rx="2" fill="#f7f5f0"/>
<text x="402" y="205" fill="#636575" font-size="8" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">YES</text>
<rect x="268" y="266" width="24" height="12" rx="2" fill="#f7f5f0"/>
<text x="280" y="275" fill="#636575" font-size="8" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">NO</text>
<rect x="390" y="468" width="24" height="12" rx="2" fill="#f7f5f0"/>
<text x="402" y="477" fill="#636575" font-size="8" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">NO</text>
<rect x="268" y="538" width="28" height="12" rx="2" fill="#f7f5f0"/>
<text x="282" y="547" fill="#636575" font-size="8" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">YES</text>
<rect x="140" y="24" width="240" height="40" rx="20" fill="#f7f5f0"/>
<rect x="140" y="24" width="240" height="40" rx="20" fill="#000523" fill-opacity="0.03" stroke="#000523" stroke-opacity="0.30" stroke-width="1"/>
<text x="260" y="48" fill="#000523" font-size="12" font-weight="600" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">Reader opens a report</text>
<rect x="140" y="96" width="240" height="48" rx="6" fill="#ffffff" stroke="#000523" stroke-width="1"/>
<text x="260" y="117" fill="#000523" font-size="12" font-weight="600" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">Show the first page</text>
<text x="260" y="131" fill="#56596b" font-size="9" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle">GET /reports/{slug} · preview</text>
<polygon points="260,176 364,216 260,256 156,216" fill="#ffffff" stroke="#000523" stroke-width="1"/>
<text x="260" y="213" fill="#000523" font-size="12" font-weight="600" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">Returning</text>
<text x="260" y="227" fill="#000523" font-size="12" font-weight="600" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">reader?</text>
<rect x="440" y="192" width="216" height="48" rx="20" fill="#f7f5f0"/>
<rect x="440" y="192" width="216" height="48" rx="20" fill="#000523" fill-opacity="0.03" stroke="#000523" stroke-opacity="0.30" stroke-width="1"/>
<text x="548" y="213" fill="#000523" font-size="12" font-weight="600" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">Full report</text>
<text x="548" y="227" fill="#56596b" font-size="9" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle">reader cookie found</text>
<rect x="140" y="288" width="240" height="48" rx="6" fill="#ffffff" stroke="#000523" stroke-width="1"/>
<text x="260" y="309" fill="#000523" font-size="12" font-weight="600" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">Reader asks for a code</text>
<text x="260" y="323" fill="#56596b" font-size="9" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle">name · email · POST /unlock</text>
<rect x="140" y="368" width="240" height="48" rx="6" fill="#ffffff" stroke="#000523" stroke-width="1"/>
<text x="260" y="389" fill="#000523" font-size="12" font-weight="600" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">Email a 6-digit code</text>
<text x="260" y="403" fill="#56596b" font-size="9" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle">SES · 10 minutes · nothing recorded</text>
<polygon points="260,448 364,488 260,528 156,488" fill="#ffffff" stroke="#000523" stroke-width="1"/>
<text x="260" y="485" fill="#000523" font-size="12" font-weight="600" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">Code</text>
<text x="260" y="499" fill="#000523" font-size="12" font-weight="600" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">correct?</text>
<rect x="440" y="464" width="216" height="48" rx="6" fill="#ffffff" stroke="#000523" stroke-width="1"/>
<text x="548" y="485" fill="#000523" font-size="12" font-weight="600" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">Try again</text>
<text x="548" y="499" fill="#56596b" font-size="9" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle">five guesses · 400 or 410</text>
<rect x="140" y="560" width="240" height="48" rx="6" fill="#ffffff" stroke="#000523" stroke-width="1"/>
<text x="260" y="581" fill="#000523" font-size="12" font-weight="600" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">Record the reader</text>
<text x="260" y="595" fill="#56596b" font-size="9" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle">Attio person · org if given</text>
<rect x="140" y="640" width="240" height="48" rx="20" fill="#f7f5f0"/>
<rect x="140" y="640" width="240" height="48" rx="20" fill="#c6e1ee" stroke="#336a85" stroke-width="1"/>
<text x="260" y="661" fill="#000523" font-size="12" font-weight="600" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">Full report and PDF</text>
<text x="260" y="675" fill="#56596b" font-size="9" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle">reader cookie set</text>
<line x1="24" y1="728" x2="696" y2="728" stroke="#000523" stroke-opacity="0.10" stroke-width="0.8"/>
<text x="24" y="744" fill="#56596b" font-size="8" font-family="'Geist Mono', ui-monospace, Menlo, monospace" letter-spacing="0.18em">LEGEND</text>
<rect x="24" y="756" width="24" height="12" rx="6" fill="#000523" fill-opacity="0.03" stroke="#000523" stroke-opacity="0.30" stroke-width="1"/>
<text x="56" y="765" fill="#56596b" font-size="9" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif">Start / end</text>
<rect x="144" y="756" width="24" height="12" rx="2" fill="#ffffff" stroke="#000523" stroke-width="1"/>
<text x="176" y="765" fill="#56596b" font-size="9" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif">Step</text>
<polygon points="228,762 240,756 252,762 240,768" fill="#ffffff" stroke="#000523" stroke-width="1"/>
<text x="260" y="765" fill="#56596b" font-size="9" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif">Decision</text>
<line x1="332" y1="762" x2="356" y2="762" stroke="#336a85" stroke-width="1.4" marker-end="url(#report-unlock-arrow-accent)"/>
<text x="364" y="765" fill="#56596b" font-size="9" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif">Main path</text>
