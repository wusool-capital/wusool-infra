      <style>#n8n-runtime-root { font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; color: #000523; }
      #n8n-runtime-root .diagram-container { width: 100%; overflow-x: auto; }
      #n8n-runtime-root .diagram-container { overflow-x: visible; }</style>
