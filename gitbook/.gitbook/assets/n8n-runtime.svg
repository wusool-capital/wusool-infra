<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 720 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="n8n-runtime-title n8n-runtime-desc" id="n8n-runtime-root">
        <title id="n8n-runtime-title">How a request reaches n8n</title>
        <desc id="n8n-runtime-desc">Flowchart: Caddy terminates HTTPS and forwards to n8n, which runs the workflow, sends Code nodes to the task runner, calls external services, and keeps state on the instance volume.</desc>
