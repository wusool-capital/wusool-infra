<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 720 784" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="attio-webhook-title attio-webhook-desc" id="attio-webhook-root">
        <title id="attio-webhook-title">How the webhook syncs a change</title>
        <desc id="attio-webhook-desc">Flowchart: Attio sends a signed webhook, the server checks the signature, environment and workspace, replies 200 at once, then re-fetches the record and updates the mirror.</desc>
        <defs>
      <style>#attio-webhook-root { font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; color: #000523; }
      #attio-webhook-root .diagram-container { width: 100%; overflow-x: auto; }
      #attio-webhook-root .diagram-container { overflow-x: visible; }</style>
          <marker id="attio-webhook-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#56596b"/></marker>
          <marker id="attio-webhook-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#336a85"/></marker>
          <marker id="attio-webhook-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#336a85"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f7f5f0"/>
<line x1="260" y1="64" x2="260" y2="96" stroke="#56596b" stroke-width="1.2" marker-end="url(#attio-webhook-arrow)"/>
<line x1="260" y1="144" x2="260" y2="176" stroke="#56596b" stroke-width="1.2" marker-end="url(#attio-webhook-arrow)"/>
<line x1="364" y1="216" x2="440" y2="216" stroke="#56596b" stroke-width="1.2" marker-end="url(#attio-webhook-arrow)"/>
<line x1="260" y1="256" x2="260" y2="288" stroke="#56596b" stroke-width="1.2" marker-end="url(#attio-webhook-arrow)"/>
<line x1="364" y1="328" x2="440" y2="328" stroke="#56596b" stroke-width="1.2" marker-end="url(#attio-webhook-arrow)"/>
<line x1="260" y1="368" x2="260" y2="400" stroke="#56596b" stroke-width="1.2" marker-end="url(#attio-webhook-arrow)"/>
<line x1="260" y1="448" x2="260" y2="480" stroke="#56596b" stroke-width="1.2" marker-end="url(#attio-webhook-arrow)"/>
<line x1="260" y1="528" x2="260" y2="560" stroke="#56596b" stroke-width="1.2" marker-end="url(#attio-webhook-arrow)"/>
<line x1="260" y1="608" x2="260" y2="640" stroke="#336a85" stroke-width="1.4" marker-end="url(#attio-webhook-arrow-accent)"/>
<rect x="390" y="196" width="24" height="12" rx="2" fill="#f7f5f0"/>
<text x="402" y="205" fill="#636575" font-size="8" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">NO</text>
<rect x="268" y="266" width="28" height="12" rx="2" fill="#f7f5f0"/>
<text x="282" y="275" fill="#636575" font-size="8" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">YES</text>
<rect x="390" y="308" width="24" height="12" rx="2" fill="#f7f5f0"/>
<text x="402" y="317" fill="#636575" font-size="8" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">NO</text>
<rect x="268" y="378" width="28" height="12" rx="2" fill="#f7f5f0"/>
<text x="282" y="387" fill="#636575" font-size="8" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">YES</text>
<rect x="140" y="24" width="240" height="40" rx="20" fill="#f7f5f0"/>
<rect x="140" y="24" width="240" height="40" rx="20" fill="#000523" fill-opacity="0.03" stroke="#000523" stroke-opacity="0.30" stroke-width="1"/>
<text x="260" y="48" fill="#000523" font-size="12" font-weight="600" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">Change made in Attio</text>
<rect x="140" y="96" width="240" height="48" rx="6" fill="#ffffff" stroke="#000523" stroke-width="1"/>
<text x="260" y="117" fill="#000523" font-size="12" font-weight="600" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">Signed webhook arrives</text>
<text x="260" y="131" fill="#56596b" font-size="9" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle">POST /webhooks/attio</text>
<polygon points="260,176 364,216 260,256 156,216" fill="#ffffff" stroke="#000523" stroke-width="1"/>
<text x="260" y="213" fill="#000523" font-size="12" font-weight="600" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">Signature</text>
<text x="260" y="227" fill="#000523" font-size="12" font-weight="600" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">valid?</text>
<rect x="440" y="192" width="216" height="48" rx="20" fill="#f7f5f0"/>
<rect x="440" y="192" width="216" height="48" rx="20" fill="#000523" fill-opacity="0.03" stroke="#000523" stroke-opacity="0.30" stroke-width="1"/>
<text x="548" y="213" fill="#000523" font-size="12" font-weight="600" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">Rejected</text>
<text x="548" y="227" fill="#56596b" font-size="9" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle">401 · before any work</text>
<polygon points="260,288 364,328 260,368 156,328" fill="#ffffff" stroke="#000523" stroke-width="1"/>
<text x="260" y="325" fill="#000523" font-size="12" font-weight="600" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">Production and</text>
<text x="260" y="339" fill="#000523" font-size="12" font-weight="600" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">our workspace?</text>
<rect x="440" y="304" width="216" height="48" rx="20" fill="#f7f5f0"/>
<rect x="440" y="304" width="216" height="48" rx="20" fill="#000523" fill-opacity="0.03" stroke="#000523" stroke-opacity="0.30" stroke-width="1"/>
<text x="548" y="325" fill="#000523" font-size="12" font-weight="600" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">Ignored</text>
<text x="548" y="339" fill="#56596b" font-size="9" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle">200 · dev ignores all</text>
<rect x="140" y="400" width="240" height="48" rx="6" fill="#ffffff" stroke="#000523" stroke-width="1"/>
<text x="260" y="421" fill="#000523" font-size="12" font-weight="600" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">Reply 200, work in background</text>
<text x="260" y="435" fill="#56596b" font-size="9" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle">so Attio never retries</text>
<rect x="140" y="480" width="240" height="48" rx="6" fill="#ffffff" stroke="#000523" stroke-width="1"/>
<text x="260" y="501" fill="#000523" font-size="12" font-weight="600" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">Re-fetch the record</text>
<text x="260" y="515" fill="#56596b" font-size="9" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle">check it is in scope</text>
<rect x="140" y="560" width="240" height="48" rx="6" fill="#ffffff" stroke="#000523" stroke-width="1"/>
<text x="260" y="581" fill="#000523" font-size="12" font-weight="600" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">Update the mirror</text>
<text x="260" y="595" fill="#56596b" font-size="9" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle">deletes set removed_at</text>
<rect x="140" y="640" width="240" height="48" rx="20" fill="#f7f5f0"/>
<rect x="140" y="640" width="240" height="48" rx="20" fill="#c6e1ee" stroke="#336a85" stroke-width="1"/>
<text x="260" y="668" fill="#000523" font-size="12" font-weight="600" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">Mirror is current</text>
<line x1="24" y1="728" x2="696" y2="728" stroke="#000523" stroke-opacity="0.10" stroke-width="0.8"/>
<text x="24" y="744" fill="#56596b" font-size="8" font-family="'Geist Mono', ui-monospace, Menlo, monospace" letter-spacing="0.18em">LEGEND</text>
<rect x="24" y="756" width="24" height="12" rx="6" fill="#000523" fill-opacity="0.03" stroke="#000523" stroke-opacity="0.30" stroke-width="1"/>
<text x="56" y="765" fill="#56596b" font-size="9" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif">Start / end</text>
<rect x="144" y="756" width="24" height="12" rx="2" fill="#ffffff" stroke="#000523" stroke-width="1"/>
<text x="176" y="765" fill="#56596b" font-size="9" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif">Step</text>
<polygon points="228,762 240,756 252,762 240,768" fill="#ffffff" stroke="#000523" stroke-width="1"/>
<text x="260" y="765" fill="#56596b" font-size="9" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif">Decision</text>
<line x1="332" y1="762" x2="356" y2="762" stroke="#336a85" stroke-width="1.4" marker-end="url(#attio-webhook-arrow-accent)"/>
<text x="364" y="765" fill="#56596b" font-size="9" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif">Main path</text>
      </svg>
