        <title id="discrepancy-check-title">How the discrepancy check decides</title>
        <desc id="discrepancy-check-desc">Flowchart: skip the AI when nothing could conflict, read the note with one Bedrock call, keep only labelled amounts, apply deterministic rules, and write a templated message.</desc>
