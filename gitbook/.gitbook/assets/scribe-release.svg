<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 720 672" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="scribe-release-title scribe-release-desc" id="scribe-release-root">
        <title id="scribe-release-title">How a Scribe update reaches users</title>
        <desc id="scribe-release-desc">Flowchart: run the release workflow, check the version files agree, build and sign, upload the update and latest.json, invalidate CloudFront; Scribe then reads the stable feed.</desc>
        <defs>
      <style>#scribe-release-root { font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; color: #000523; }
      #scribe-release-root .diagram-container { width: 100%; overflow-x: auto; }
      #scribe-release-root .diagram-container { overflow-x: visible; }</style>
          <marker id="scribe-release-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#56596b"/></marker>
          <marker id="scribe-release-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#336a85"/></marker>
          <marker id="scribe-release-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#336a85"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f7f5f0"/>
<line x1="260" y1="64" x2="260" y2="96" stroke="#56596b" stroke-width="1.2" marker-end="url(#scribe-release-arrow)"/>
<line x1="364" y1="136" x2="440" y2="136" stroke="#56596b" stroke-width="1.2" marker-end="url(#scribe-release-arrow)"/>
<line x1="260" y1="176" x2="260" y2="208" stroke="#56596b" stroke-width="1.2" marker-end="url(#scribe-release-arrow)"/>
<line x1="260" y1="256" x2="260" y2="288" stroke="#56596b" stroke-width="1.2" marker-end="url(#scribe-release-arrow)"/>
<line x1="260" y1="336" x2="260" y2="368" stroke="#56596b" stroke-width="1.2" marker-end="url(#scribe-release-arrow)"/>
<line x1="260" y1="416" x2="260" y2="448" stroke="#56596b" stroke-width="1.2" marker-end="url(#scribe-release-arrow)"/>
<line x1="260" y1="496" x2="260" y2="528" stroke="#336a85" stroke-width="1.4" marker-end="url(#scribe-release-arrow-accent)"/>
<rect x="390" y="116" width="24" height="12" rx="2" fill="#f7f5f0"/>
<text x="402" y="125" fill="#636575" font-size="8" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">NO</text>
<rect x="268" y="186" width="28" height="12" rx="2" fill="#f7f5f0"/>
<text x="282" y="195" fill="#636575" font-size="8" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">YES</text>
<rect x="140" y="24" width="240" height="40" rx="20" fill="#f7f5f0"/>
<rect x="140" y="24" width="240" height="40" rx="20" fill="#000523" fill-opacity="0.03" stroke="#000523" stroke-opacity="0.30" stroke-width="1"/>
<text x="260" y="48" fill="#000523" font-size="12" font-weight="600" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">Run scribe-release</text>
<polygon points="260,96 364,136 260,176 156,136" fill="#ffffff" stroke="#000523" stroke-width="1"/>
<text x="260" y="133" fill="#000523" font-size="12" font-weight="600" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">Version files</text>
<text x="260" y="147" fill="#000523" font-size="12" font-weight="600" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">agree?</text>
<rect x="440" y="112" width="216" height="48" rx="20" fill="#f7f5f0"/>
<rect x="440" y="112" width="216" height="48" rx="20" fill="#000523" fill-opacity="0.03" stroke="#000523" stroke-opacity="0.30" stroke-width="1"/>
<text x="548" y="133" fill="#000523" font-size="12" font-weight="600" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">Release stops</text>
<text x="548" y="147" fill="#56596b" font-size="9" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle">bump all three files</text>
<rect x="140" y="208" width="240" height="48" rx="6" fill="#ffffff" stroke="#000523" stroke-width="1"/>
<text x="260" y="229" fill="#000523" font-size="12" font-weight="600" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">Build and sign</text>
<text x="260" y="243" fill="#56596b" font-size="9" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle">Apple silicon · minisign</text>
<rect x="140" y="288" width="240" height="48" rx="6" fill="#ffffff" stroke="#000523" stroke-width="1"/>
<text x="260" y="309" fill="#000523" font-size="12" font-weight="600" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">Upload the update</text>
<text x="260" y="323" fill="#56596b" font-size="9" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle">payload first · then latest.json</text>
<rect x="140" y="368" width="240" height="48" rx="6" fill="#ffffff" stroke="#000523" stroke-width="1"/>
<text x="260" y="389" fill="#000523" font-size="12" font-weight="600" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">Invalidate CloudFront</text>
<text x="260" y="403" fill="#56596b" font-size="9" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle">so the new feed is served</text>
<rect x="140" y="448" width="240" height="48" rx="6" fill="#ffffff" stroke="#000523" stroke-width="1"/>
<text x="260" y="469" fill="#000523" font-size="12" font-weight="600" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">Scribe checks the feed</text>
<text x="260" y="483" fill="#56596b" font-size="9" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle">stable channel only</text>
<rect x="120" y="528" width="280" height="48" rx="20" fill="#f7f5f0"/>
<rect x="120" y="528" width="280" height="48" rx="20" fill="#c6e1ee" stroke="#336a85" stroke-width="1"/>
<text x="260" y="549" fill="#000523" font-size="12" font-weight="600" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">Users are offered the update</text>
<text x="260" y="563" fill="#56596b" font-size="9" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle">beta reaches nobody</text>
<line x1="24" y1="616" x2="696" y2="616" stroke="#000523" stroke-opacity="0.10" stroke-width="0.8"/>
<text x="24" y="632" fill="#56596b" font-size="8" font-family="'Geist Mono', ui-monospace, Menlo, monospace" letter-spacing="0.18em">LEGEND</text>
<rect x="24" y="644" width="24" height="12" rx="6" fill="#000523" fill-opacity="0.03" stroke="#000523" stroke-opacity="0.30" stroke-width="1"/>
<text x="56" y="653" fill="#56596b" font-size="9" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif">Start / end</text>
<rect x="144" y="644" width="24" height="12" rx="2" fill="#ffffff" stroke="#000523" stroke-width="1"/>
<text x="176" y="653" fill="#56596b" font-size="9" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif">Step</text>
<polygon points="228,650 240,644 252,650 240,656" fill="#ffffff" stroke="#000523" stroke-width="1"/>
<text x="260" y="653" fill="#56596b" font-size="9" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif">Decision</text>
<line x1="332" y1="650" x2="356" y2="650" stroke="#336a85" stroke-width="1.4" marker-end="url(#scribe-release-arrow-accent)"/>
<text x="364" y="653" fill="#56596b" font-size="9" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif">Main path</text>
      </svg>
