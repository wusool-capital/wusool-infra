[project]
name = "matching-engine"
version = "0.1.0"
description = "Buyer-Seller Matching & Intelligence Platform backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.35",
    "asyncpg>=0.30.0",
    "greenlet>=3.1.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "slack-bolt>=1.21.0",
    "aiohttp>=3.10.0",
    "boto3>=1.35.0",
    "firecrawl-py>=1.0.0",
    "toolkit-shared",
    "wusool-db",
]

[tool.uv.sources]
toolkit-shared = { workspace = true }
# `database/` is a sibling of `workflows/wusool-toolkit/` (this workspace's
# root), one level up — it cannot be a uv workspace member (see
# ALEMBIC_MIGRATION_HANDOVER.md point 1), so it's a path dependency instead.
wusool-db = { path = "../../../database", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
    "ty>=0.0.1a1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Matches the process-wide, lru_cache'd async engine's lifetime (Phase 1's
# get_engine()) — the default per-function loop scope tears down and
# recreates the event loop for every test, which breaks a cached asyncpg
# engine created under a prior test's now-closed loop.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
