services:
  db:
    # Plain postgres:16-alpine doesn't ship pgvector, and 001_extensions.sql's
    # `CREATE EXTENSION vector` failure is fatal to Postgres's own init-script
    # runner (unlike a manual, non-`set -e` apply) — use an image that
    # actually has the extension, closer to the real RDS instance anyway.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: matching
      POSTGRES_PASSWORD: matching
      POSTGRES_DB: wusool_crm
    ports:
      - "55432:5432"
    volumes:
      - matching-engine-db-data:/var/lib/postgresql/data
      # Applies 001-006 in order on first init only (Postgres only runs
      # /docker-entrypoint-initdb.d/ against an empty data directory) — the
      # exact same schema files the real wusool_crm database uses. This is
      # a local, throwaway copy; never point this at the real database.
      # :Z relabels the bind mount for SELinux-enforcing rootless-Podman
      # hosts (a no-op elsewhere, e.g. Docker Desktop / non-SELinux Linux).
      - ../../database/sql:/docker-entrypoint-initdb.d:ro,Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matching -d wusool_crm"]
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    # One process, one Slack app: /find-match (matching-engine) and
    # /edit-seller, /edit-buyer, /add-seller, /add-buyer (ddl-commands)
    # all served by the root main.py — see workflows/wusool-toolkit/README.md.
    # Context is the repo root, not this directory — the Dockerfile now
    # needs database/ alongside workflows/wusool-toolkit/ (see Dockerfile's
    # own comment for why). Matches how CI's _build.yml invokes it.
    build:
      context: ../..
      dockerfile: workflows/wusool-toolkit/Dockerfile
    ports:
      - "8000:8000"
    environment:
      # Always the bundled `db` service — intentionally not overridable via
      # .env, so a developer's real-tunnel DATABASE_URL never leaks in here.
      DATABASE_URL: postgresql://matching:matching@db:5432/wusool_crm
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-xoxb-local-dev}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-local-dev-secret}
      AWS_REGION: ${AWS_REGION:-eu-central-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
      ENABLE_SELLER_MEETING_NOTES: ${ENABLE_SELLER_MEETING_NOTES:-true}
      SYNC_ALERT_WEBHOOK_URL: ${SYNC_ALERT_WEBHOOK_URL:-}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  migrate:
    # The flat SQL files establish only the legacy pre-Alembic baseline. On a
    # new volume there is no version row yet, so stamp that baseline once;
    # existing volumes retain their real revision and only upgrade forward.
    build:
      context: ../..
      dockerfile: workflows/wusool-toolkit/Dockerfile
    environment:
      DATABASE_URL: postgresql://matching:matching@db:5432/wusool_crm
    command:
      - sh
      - -ec
      - |
        current="$$(python -m alembic -c database/alembic.ini current)"
        if [ -z "$$current" ]; then
          python -m alembic -c database/alembic.ini stamp 87320bb9dc8d
        fi
        python -m alembic -c database/alembic.ini upgrade head
    depends_on:
      db:
        condition: service_healthy

volumes:
  matching-engine-db-data:
