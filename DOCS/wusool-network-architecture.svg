<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Wusool Network Architecture</title>
  <desc id="desc">Network architecture diagram for the Wusool n8n Terraform environment.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .region { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; }
      .vpc { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2; }
      .public { fill: #ecfeff; stroke: #06b6d4; stroke-width: 2; }
      .private { fill: #f8fafc; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 8 6; }
      .node { fill: #ffffff; stroke: #64748b; stroke-width: 1.6; }
      .service { fill: #fff7ed; stroke: #fb923c; stroke-width: 1.6; }
      .security { fill: #fef2f2; stroke: #ef4444; stroke-width: 1.6; }
      .ops { fill: #f5f3ff; stroke: #8b5cf6; stroke-width: 1.6; }
      .data { fill: #fefce8; stroke: #eab308; stroke-width: 1.6; }
      .title { font: 700 28px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 15px Arial, sans-serif; fill: #475569; }
      .section { font: 700 18px Arial, sans-serif; fill: #0f172a; }
      .label { font: 700 14px Arial, sans-serif; fill: #0f172a; }
      .small { font: 400 12px Arial, sans-serif; fill: #334155; }
      .tiny { font: 400 11px Arial, sans-serif; fill: #64748b; }
      .line { stroke: #334155; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #64748b; stroke-width: 2; fill: none; stroke-dasharray: 7 6; marker-end: url(#arrow); }
      .green { stroke: #16a34a; }
      .blue { stroke: #2563eb; }
      .purple { stroke: #7c3aed; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
  </defs>

  <rect class="bg" width="1400" height="900"/>
  <text x="40" y="52" class="title">Wusool Network Architecture</text>
  <text x="40" y="78" class="subtitle">Terraform-managed reusable AWS environment - n8n served through HTTPS</text>

  <rect x="40" y="115" width="180" height="92" rx="8" class="node"/>
  <text x="130" y="147" text-anchor="middle" class="label">n8n Users</text>
  <text x="130" y="169" text-anchor="middle" class="small">Browser / API clients</text>
  <text x="130" y="188" text-anchor="middle" class="tiny">HTTPS :443</text>

  <rect x="40" y="275" width="180" height="96" rx="8" class="ops"/>
  <text x="130" y="307" text-anchor="middle" class="label">Administrator</text>
  <text x="130" y="329" text-anchor="middle" class="small">Terraform CLI</text>
  <text x="130" y="348" text-anchor="middle" class="tiny">SSM Session Manager</text>

  <rect x="270" y="115" width="1030" height="645" rx="12" class="region"/>
  <text x="295" y="148" class="section">AWS Account and Region</text>

  <rect x="305" y="185" width="720" height="460" rx="12" class="vpc"/>
  <text x="330" y="218" class="section">Environment VPC</text>

  <rect x="335" y="260" width="480" height="315" rx="10" class="public"/>
  <text x="360" y="291" class="section">Public Subnet</text>

  <rect x="355" y="325" width="150" height="76" rx="8" class="node"/>
  <text x="430" y="353" text-anchor="middle" class="label">Elastic IP</text>
  <text x="430" y="374" text-anchor="middle" class="small">Stable public IP</text>
  <text x="430" y="391" text-anchor="middle" class="tiny">DNS target</text>

  <rect x="535" y="325" width="170" height="76" rx="8" class="security"/>
  <text x="620" y="350" text-anchor="middle" class="label">Security Group</text>
  <text x="620" y="371" text-anchor="middle" class="small">Allow 80 / 443</text>
  <text x="620" y="389" text-anchor="middle" class="tiny">Close SSH and 5678</text>

  <rect x="445" y="435" width="330" height="110" rx="10" class="service"/>
  <text x="610" y="463" text-anchor="middle" class="label">EC2 - Amazon Linux 2023</text>
  <text x="610" y="485" text-anchor="middle" class="small">Docker Compose runtime</text>
  <text x="535" y="515" text-anchor="middle" class="small">Caddy :443</text>
  <text x="688" y="515" text-anchor="middle" class="small">n8n :5678 internal</text>
  <path d="M 575 510 L 645 510" class="line green"/>

  <rect x="835" y="260" width="160" height="315" rx="10" class="private"/>
  <text x="915" y="292" text-anchor="middle" class="section">Private Subnet</text>
  <text x="915" y="315" text-anchor="middle" class="small">Reserved</text>
  <text x="915" y="360" text-anchor="middle" class="small">Future workload</text>
  <text x="915" y="381" text-anchor="middle" class="tiny">No current app</text>
  <text x="915" y="400" text-anchor="middle" class="tiny">No public ingress</text>

  <rect x="1110" y="185" width="150" height="70" rx="8" class="node"/>
  <text x="1185" y="213" text-anchor="middle" class="label">Internet Gateway</text>
  <text x="1185" y="235" text-anchor="middle" class="tiny">Public ingress</text>

  <rect x="1070" y="295" width="190" height="76" rx="8" class="ops"/>
  <text x="1165" y="324" text-anchor="middle" class="label">Systems Manager</text>
  <text x="1165" y="345" text-anchor="middle" class="small">Session + bootstrap</text>

  <rect x="1070" y="405" width="190" height="82" rx="8" class="ops"/>
  <text x="1165" y="433" text-anchor="middle" class="label">CloudWatch + SNS</text>
  <text x="1165" y="454" text-anchor="middle" class="small">Logs and alarms</text>
  <text x="1165" y="472" text-anchor="middle" class="tiny">Email notifications</text>

  <rect x="1070" y="525" width="190" height="82" rx="8" class="data"/>
  <text x="1165" y="553" text-anchor="middle" class="label">Audit Services</text>
  <text x="1165" y="574" text-anchor="middle" class="small">CloudTrail + S3</text>
  <text x="1165" y="592" text-anchor="middle" class="tiny">GuardDuty + Security Hub</text>

  <rect x="330" y="675" width="230" height="62" rx="8" class="data"/>
  <text x="445" y="701" text-anchor="middle" class="label">Terraform State Backend</text>
  <text x="445" y="722" text-anchor="middle" class="small">S3 native lock file</text>

  <rect x="600" y="675" width="230" height="62" rx="8" class="data"/>
  <text x="715" y="701" text-anchor="middle" class="label">Encrypted Storage</text>
  <text x="715" y="722" text-anchor="middle" class="small">Encrypted gp3 root volume</text>

  <path d="M 220 160 L 1110 220" class="line blue"/>
  <path d="M 1185 255 L 505 360" class="line blue"/>
  <path d="M 505 363 L 535 363" class="line"/>
  <path d="M 620 401 L 610 435" class="line green"/>
  <path d="M 220 320 L 1070 333" class="dash purple"/>
  <path d="M 220 320 L 445 675" class="dash"/>
  <path d="M 610 545 L 715 675" class="line green"/>
  <path d="M 775 490 L 1070 446" class="dash purple"/>
  <path d="M 775 505 L 1070 566" class="dash purple"/>

  <rect x="40" y="805" width="1260" height="52" rx="8" class="panel"/>
  <text x="62" y="827" class="label">Key Controls</text>
  <text x="62" y="849" class="small">Public ingress is limited to HTTP/HTTPS. n8n port 5678 remains internal. Administration uses SSM instead of public SSH. State, audit logs, and EC2 storage are encrypted.</text>
</svg>
