<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Wusool development AWS network architecture</title>
  <desc id="desc">Network diagram of the Wusool n8n development environment in eu-central-1.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
    <style>
      .title{font:700 30px Arial,sans-serif;fill:#0f172a}
      .subtitle{font:400 15px Arial,sans-serif;fill:#64748b}
      .section{font:700 17px Arial,sans-serif;fill:#334155}
      .label{font:700 14px Arial,sans-serif;fill:#0f172a}
      .small{font:400 12px Arial,sans-serif;fill:#475569}
      .tiny{font:400 11px Arial,sans-serif;fill:#64748b}
      .white{fill:#fff}
      .node{fill:#fff;stroke:#cbd5e1;stroke-width:1.5;rx:12;filter:url(#shadow)}
      .line{fill:none;stroke:#475569;stroke-width:2;marker-end:url(#arrow)}
      .blueLine{fill:none;stroke:#2563eb;stroke-width:2.5;marker-end:url(#arrowBlue)}
      .dash{fill:none;stroke:#64748b;stroke-width:1.8;stroke-dasharray:7 6;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="1600" height="1000" fill="#f8fafc"/>
  <rect x="0" y="0" width="1600" height="84" fill="#0f172a"/>
  <text x="52" y="43" class="title white">Wusool — Development Network Architecture</text>
  <text x="52" y="67" class="subtitle" fill="#cbd5e1">Terraform-managed AWS environment · eu-central-1 (Frankfurt) · n8n on Amazon Linux 2023</text>

  <!-- External actors -->
  <rect x="45" y="168" width="180" height="92" class="node"/>
  <circle cx="90" cy="205" r="18" fill="#2563eb"/>
  <circle cx="90" cy="196" r="6" fill="#fff"/>
  <path d="M78 218c3-10 21-10 24 0" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
  <text x="119" y="204" class="label">n8n Users</text>
  <text x="119" y="225" class="small">Public internet</text>

  <rect x="45" y="710" width="180" height="100" class="node"/>
  <circle cx="90" cy="749" r="18" fill="#7c3aed"/>
  <path d="M80 749h20M90 739v20" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <text x="119" y="746" class="label">Administrator</text>
  <text x="119" y="767" class="small">Terraform + AWS SSM</text>
  <text x="119" y="785" class="tiny">No public SSH</text>

  <!-- AWS region -->
  <rect x="280" y="120" width="1270" height="820" rx="20" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <rect x="280" y="120" width="1270" height="48" rx="20" fill="#ffedd5"/>
  <rect x="280" y="148" width="1270" height="20" fill="#ffedd5"/>
  <text x="310" y="151" class="section">AWS Region: eu-central-1</text>

  <!-- Internet Gateway -->
  <rect x="315" y="188" width="180" height="72" class="node"/>
  <circle cx="352" cy="224" r="20" fill="#f97316"/>
  <path d="M340 224h24M352 212v24M343 215l18 18M361 215l-18 18" stroke="#fff" stroke-width="2"/>
  <text x="382" y="220" class="label">Internet Gateway</text>
  <text x="382" y="240" class="small">0.0.0.0/0 route</text>

  <!-- VPC -->
  <rect x="315" y="288" width="890" height="555" rx="18" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
  <text x="342" y="321" class="section">Development VPC · 10.10.0.0/16</text>

  <!-- Public subnet -->
  <rect x="345" y="346" width="530" height="455" rx="15" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="370" y="378" class="section">Public Subnet · 10.10.1.0/24 · AZ 1</text>
  <text x="370" y="399" class="tiny">Public route table → Internet Gateway</text>

  <rect x="385" y="425" width="180" height="75" class="node"/>
  <circle cx="420" cy="462" r="19" fill="#0ea5e9"/>
  <text x="420" y="468" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#fff">IP</text>
  <text x="451" y="455" class="label">Elastic IP</text>
  <text x="451" y="476" class="small">sslip.io hostname</text>

  <rect x="595" y="425" width="235" height="75" class="node"/>
  <path d="M625 448l18-8 18 8v14c0 13-9 22-18 26-9-4-18-13-18-26z" fill="#ef4444"/>
  <path d="M636 461l5 5 10-12" fill="none" stroke="#fff" stroke-width="3"/>
  <text x="674" y="454" class="label">Security Group</text>
  <text x="674" y="474" class="small">Inbound 80 / 443</text>
  <text x="674" y="490" class="tiny">5678 closed · SSH disabled</text>

  <!-- EC2 -->
  <rect x="385" y="535" width="445" height="222" rx="15" fill="#fff" stroke="#f97316" stroke-width="2.5" filter="url(#shadow)"/>
  <rect x="385" y="535" width="445" height="45" rx="15" fill="#ffedd5"/>
  <rect x="385" y="565" width="445" height="15" fill="#ffedd5"/>
  <text x="408" y="563" class="section">EC2 · t3.small · Amazon Linux 2023 · x86_64</text>

  <rect x="410" y="603" width="165" height="93" rx="10" fill="#ecfeff" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="492" y="633" text-anchor="middle" class="label">Caddy</text>
  <text x="492" y="654" text-anchor="middle" class="small">TLS termination</text>
  <text x="492" y="673" text-anchor="middle" class="small">Reverse proxy :443</text>

  <rect x="640" y="603" width="165" height="93" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="722" y="633" text-anchor="middle" class="label">n8n Container</text>
  <text x="722" y="654" text-anchor="middle" class="small">Internal port :5678</text>
  <text x="722" y="673" text-anchor="middle" class="small">Docker network</text>

  <rect x="503" y="715" width="215" height="28" rx="8" fill="#e2e8f0" stroke="#64748b"/>
  <text x="610" y="734" text-anchor="middle" class="small">Encrypted gp3 EBS · 30 GiB</text>

  <!-- Private subnet -->
  <rect x="905" y="346" width="270" height="455" rx="15" fill="#f8fafc" stroke="#64748b" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="930" y="378" class="section">Private Subnet</text>
  <text x="930" y="400" class="small">10.10.2.0/24 · AZ 2</text>
  <rect x="942" y="466" width="195" height="105" class="node"/>
  <text x="1039" y="500" text-anchor="middle" class="label">Reserved</text>
  <text x="1039" y="522" text-anchor="middle" class="small">No workloads</text>
  <text x="1039" y="542" text-anchor="middle" class="small">No internet route</text>

  <!-- AWS managed services -->
  <rect x="1240" y="188" width="275" height="655" rx="16" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="1265" y="221" class="section">AWS Managed Services</text>

  <rect x="1270" y="250" width="215" height="75" class="node"/>
  <circle cx="1303" cy="287" r="18" fill="#7c3aed"/>
  <text x="1303" y="293" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#fff">SSM</text>
  <text x="1330" y="279" class="label">Systems Manager</text>
  <text x="1330" y="299" class="small">Session + bootstrap</text>

  <rect x="1270" y="350" width="215" height="75" class="node"/>
  <circle cx="1303" cy="387" r="18" fill="#db2777"/>
  <path d="M1293 390l7-7 6 5 8-10" fill="none" stroke="#fff" stroke-width="3"/>
  <text x="1330" y="379" class="label">CloudWatch</text>
  <text x="1330" y="399" class="small">Logs + EC2 alarms</text>

  <rect x="1270" y="450" width="215" height="75" class="node"/>
  <circle cx="1303" cy="487" r="18" fill="#f97316"/>
  <path d="M1294 480h18v14h-18zM1294 480l9 8 9-8" fill="none" stroke="#fff" stroke-width="2"/>
  <text x="1330" y="479" class="label">SNS</text>
  <text x="1330" y="499" class="small">Email notifications</text>

  <rect x="1270" y="550" width="215" height="75" class="node"/>
  <circle cx="1303" cy="587" r="18" fill="#0284c7"/>
  <path d="M1293 579h20v17h-20zM1297 575h12" fill="none" stroke="#fff" stroke-width="2"/>
  <text x="1330" y="579" class="label">CloudTrail + S3</text>
  <text x="1330" y="599" class="small">Encrypted audit logs</text>

  <rect x="1270" y="650" width="215" height="75" class="node"/>
  <circle cx="1303" cy="687" r="18" fill="#dc2626"/>
  <path d="M1294 679l9-5 9 5v9c0 8-5 13-9 16-4-3-9-8-9-16z" fill="none" stroke="#fff" stroke-width="2"/>
  <text x="1330" y="679" class="label">GuardDuty</text>
  <text x="1330" y="699" class="small">Threat detection</text>

  <rect x="1270" y="750" width="215" height="65" class="node"/>
  <circle cx="1303" cy="782" r="18" fill="#16a34a"/>
  <path d="M1295 783l5 5 11-13" fill="none" stroke="#fff" stroke-width="3"/>
  <text x="1330" y="779" class="label">Security Hub</text>
  <text x="1330" y="799" class="small">Security findings</text>

  <!-- Terraform state -->
  <rect x="315" y="867" width="420" height="53" class="node"/>
  <circle cx="348" cy="893" r="17" fill="#2563eb"/>
  <path d="M338 887c0-5 20-5 20 0v12c0 5-20 5-20 0zM338 887c0 5 20 5 20 0" fill="none" stroke="#fff" stroke-width="2"/>
  <text x="377" y="889" class="label">S3 Terraform State</text>
  <text x="377" y="908" class="small">Encrypted · versioned · private · native locking</text>

  <!-- Connections -->
  <path d="M225 214 H315" class="blueLine"/>
  <text x="244" y="202" class="tiny">HTTPS :443</text>
  <path d="M405 260 V425" class="blueLine"/>
  <path d="M565 462 H595" class="blueLine"/>
  <path d="M712 500 V535" class="blueLine"/>
  <path d="M575 649 H640" class="blueLine"/>
  <text x="591" y="638" class="tiny">HTTP :5678</text>
  <path d="M722 696 V715" class="line"/>

  <path d="M225 748 H260 V893 H315" class="dash"/>
  <text x="236" y="875" class="tiny">plan / apply</text>
  <path d="M225 770 H250 V287 H1270" class="dash"/>
  <text x="850" y="276" class="tiny">Session Manager administration</text>
  <path d="M1270 287 H1205 V645 H830" class="dash"/>
  <path d="M830 620 H1215 V387 H1270" class="dash"/>
  <text x="1060" y="607" class="tiny">metrics + logs</text>
  <path d="M1377 425 V450" class="line"/>

  <!-- Legend -->
  <rect x="770" y="867" width="745" height="53" rx="12" fill="#fff" stroke="#cbd5e1"/>
  <line x1="795" y1="887" x2="845" y2="887" stroke="#2563eb" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <text x="855" y="891" class="small">Application traffic</text>
  <line x1="995" y1="887" x2="1045" y2="887" stroke="#64748b" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
  <text x="1055" y="891" class="small">Management / telemetry</text>
  <rect x="1260" y="878" width="24" height="18" rx="4" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="1294" y="891" class="small">Network boundary</text>

  <text x="800" y="974" text-anchor="middle" class="tiny">Source: Terraform in environments/dev, modules/network, and modules/n8n-ec2 · Generated 2026-06-25</text>
</svg>
